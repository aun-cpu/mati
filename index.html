<script>
// ---------- 乱数・ノイズ ----------
let SEED = Math.floor(Math.random()*1e9);
function hash(x,y,s){let h=(x*374761393+y*668265263+s*2147483647)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)/4294967295}
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,SEED),b=hash(xi+1,yi,SEED),c=hash(xi,yi+1,SEED),d=hash(xi+1,yi+1,SEED);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y){let s=0,a=.5,f=1;for(let i=0;i<5;i++){s+=a*vnoise(x*f,y*f);f*=2;a*=.5}return s}
// 街: ワールドを TCELL(m) 四方のセルに分け、セルごとに70%で1つ、ランダムな位置・大きさ(半径500〜850m=直径1〜1.7km)・形の巨大な街ができる
// スポーン地点とは無関係に決まる（スポーンは街の外）。街同士が重ならないよう、中心のずれ幅はセルの30%まで。
const TOWN_H=3,L=14,TCELL=3600,TBLEND=150,TOWN_P=.7;      // L=1区画の大きさ
const townCache=new Map();
// 街の構成（中心から外へ）:
//  ① 中心: 四角い城壁（ミナレット付き）に囲まれた、とても大きな宮殿
//  ② 内壁（街の輪郭を縮めた形）までの広場: 庭とヤシ
//  ③ 内壁と外壁のあいだ: 入り組んだ路地の地区（建物・中庭・大モスク風の大建築）
//  ④ 外壁（街の輪郭に沿う）
// 東西南北に伸びる幅RW(m)の主要な道が、宮殿の城壁・内壁・外壁を門で通り抜ける。
const RW=12,INNER_K=.48,GW=9;
const DH=12,SLOPE=3.5,RL=DH*SLOPE,TUN=8,RGATE=8,TOWER_OFF=9.6;   // 橋の高さ / 勾配(1:3.5) / 橋の下の通路幅 / 内外壁の門(小片の中心がこれ未満なら省く) / 門塔の位置                                   // 主要な道の幅 / 内壁の半径=外壁の半径×INNER_K / 門の開口の目安(道の中心からGW)
function roadClip(t,cx,cz,ex,ez,strict){                       // 橋の下の通路・傾斜路の敷地・(strict)橋の真下に、置いてはいけない物がかかるか
  for(const q of t.roads){
    const zr=q.ax==='z',pp=zr?cx:cz,pe=zr?ex:ez,al=zr?cz:cx,ae=zr?ez:ex,off=Math.abs(pp-q.c)-pe,m=q.sg*(al-(zr?t.z:t.x)),a=m-ae,b=m+ae;
    if(b>q.sf&&a<q.s1&&off<(strict?RW/2+2:TUN/2))return true;
    if(b>q.s0-8&&a<q.sf&&off<RW/2+2)return true;
  }
  return false;
}
function underDeck(t,cx,cz,ex,ez){                              // 橋桁（平らな部分）の真下にかかるか
  for(const q of t.roads){
    const zr=q.ax==='z',pp=zr?cx:cz,pe=zr?ex:ez,al=zr?cz:cx,ae=zr?ez:ex,m=q.sg*(al-(zr?t.z:t.x));
    if(m+ae>q.sf&&m-ae<q.s1&&Math.abs(pp-q.c)-pe<RW/2+1.2)return true;
  }
  return false;
}
function deckInfo(x,z){                                         // 橋の上面の高さ(TOWN_Hからの高さ)。傾斜路ならramp=true。橋は外壁の門楼の外側の面で終わる
  for(const t of nearTowns(x,z))for(const q of t.roads){
    const zr=q.ax==='z',pp=zr?x:z;
    if(Math.abs(pp-q.c)>=RW/2)continue;
    const s=q.sg*((zr?z:x)-(zr?t.z:t.x));
    if(s<q.s0||s>q.s1)continue;
    return{h:DH,ramp:false,zr,c:q.c,s,s1:q.s1,ctr:zr?t.z:t.x,sg:q.sg};

}
const PAL={WW:44,CW:30,WH:15,CH:30,DW:24,DC:30,W:118};          // 翼棟の幅・中央棟の幅・翼棟の高さ・中央棟の高さ・翼棟の奥行・中央棟の奥行・全幅（k=1の大きさ。実際は街の大きさに合わせて拡大）
function palW(p,u,v){const c=Math.cos(p.th),s=Math.sin(p.th);u*=p.k;v*=p.k;return [p.x+u*c+v*s,p.z-u*s+v*c]}   // 宮殿の局所座標(u=横,v=正面方向)→ワールド（k倍）
function palL(p,x,z){const c=Math.cos(p.th),s=Math.sin(p.th),dx=x-p.x,dz=z-p.z;return [(dx*c-dz*s)/p.k,(dx*s+dz*c)/p.k]}
function palRect(p,u,v,w,d,h,m){const[x,z]=palW(p,u,v),sw=Math.abs(Math.sin(p.th))>.5,k=p.k;return{x,z,w:(sw?d:w)*k,d:(sw?w:d)*k,top:TOWN_H+DH+h*k,m:m===undefined?.3:m}}
const HALL_TIERS=[2,5];                                          // 本殿の段数の範囲（最小,最大）。街ごとにこの範囲でランダム
const BLUE={u:62,v0:-62,v1:58,g:22},PLAZA=25,BAR_W=48;           // 青い壁（宮殿を囲む追加の壁）: 局所座標の左右±u・奥v0・手前v1・正面の門の半幅g / 広場の半幅 / U字の建物の半幅
function makePalace(t,fx,fz,k){                                   // 宮殿（局所座標 u=横, v=正面(+)）: 奥に本殿(1)、その左右にすき間なく続く建物(2)、手前に広場(3)を囲むU字の建物。全体が u=0 の軸で左右対称
  const p={x:t.x,z:t.z,th:Math.atan2(fx,fz),k,rects:[],circs:[],bx:[],roofs:[],dc:[],wings:[],arcs:[]};

  const sdome=(x,y,z,s)=>p.dc.push(['D',x,y+.8,z,s,1.8*s],['M',x,y+.8+1.8*s,z,1.18*s,1.45*s],['F',x,y+.8+1.8*s+1.45*s,z,.36*s]);   // 小ドーム（y=屋根の下面の高さ）
  // ① 本殿: 奥(v=-55)に接して置く、n段の階段状の塔。各段は壁で囲み、屋根は縁の輪だけ（中央はあけて）、全段ぶち抜きの吹き抜け
  const hw=56+r()*10,hd=34+r()*6,n=HALL_TIERS[0]+Math.floor(r()*(HALL_TIERS[1]-HALL_TIERS[0]+1)),VB=-55,vc=VB+hd/2;p.hv=vc;   // p.hv=本殿の中心のv（デバッグのワープ用）
  const h0=17+r()*3,th=8.5+r()*2.5,inset=Math.min(5,(Math.min(hw,hd)/2-7)/(n-1));
  const tiers=[];for(let i=0;i<n;i++){const y0=i?h0+(i-1)*th:0;tiers.push({w:hw-2*inset*i,d:hd-2*inset*i,y0,y1:i?y0+th:h0})}
  const hall=W(-hw/2,hw/2,VB,VB+hd,h0),all=[hall],H=tiers[n-1].y1;
  hall.doors.f.push([0,10]);hall.noArcs=true;
  // ② 本殿の左右にすき間なく続く建物（本殿との境の壁に扉）
  const w2=20+r()*3,d2=hd*.8,h2=11+r()*5,dome2=r()<.5;
  for(const sd of[-1,1]){
    const a=sd*hw/2,b=sd*(hw/2+w2),wg=W(Math.min(a,b),Math.max(a,b),VB,VB+d2,h2);
    wg.skip[sd>0?'l':'r']=true;wg.dome=dome2;hall.doors[sd>0?'r':'l'].push([VB+d2/2,6]);all.push(wg);
  }
  // ③ 広場を囲むU字の建物: 本殿の手前に横長の棟、その両端から手前へ脚が伸びる。扉は 本殿→横長の棟→広場
  const bh=10+r()*3,b0=hall.v1,b1=b0+18,LEG=42,mid=(PLAZA+BAR_W)/2;
  const bar=W(-BAR_W,BAR_W,b0,b1,bh);bar.doors.b.push([0,10]);bar.doors.f.push([-mid,6],[0,10],[mid,6]);bar.arcRange=[-PLAZA,PLAZA];all.push(bar);
  for(const sd of[-1,1]){const a=sd*PLAZA,b=sd*BAR_W,leg=W(Math.min(a,b),Math.max(a,b),b1,b1+LEG,bh-.5);leg.skip.b=true;all.push(leg)}
  for(const wg of all){                                             // 壁（扉の上は楣）・窓・屋根
    const{u0,u1,v0,v1,h}=wg,uc=(u0+u1)/2,vcw=(v0+v1)/2,w=u1-u0,d=v1-v0;
    const wall=(sideKey,fixed,a0,a1,alongU)=>{
      if(wg.skip[sideKey])return;const ds=wg.doors[sideKey].slice().sort((a,b)=>a[0]-b[0]);let cur=a0;
      const put=(x0,x1,y0,y1)=>{if(x1-x0>.01)alongU?blk((x0+x1)/2,fixed,x1-x0,T,y0,y1):blk(fixed,(x0+x1)/2,T,x1-x0,y0,y1)};
      for(const[c,dw] of ds){put(cur,c-dw/2,0,h);put(c-dw/2,c+dw/2,DR,h);cur=c+dw/2}put(cur,a1,0,h);
    };
    const sa=wg.skip.b?v0:v0+T,sb=wg.skip.f?v1:v1-T;                  // 脚は奥の壁を持たない（横長の棟の壁と一続き）ので、側壁を奥の端まで伸ばす
    wall('f',v1-T/2,u0,u1,true);wall('b',v0+T/2,u0,u1,true);wall('l',u0+T/2,sa,sb,false);wall('r',u1-T/2,sa,sb,false);

    }

  for(let i=0;i<n;i++){
    const a=tiers[i],b=tiers[i+1];
    if(i>0){const y0=a.y0+.4,y1=a.y1;                               // 壁（前の段の屋根の板に少し埋める）
      blk(0,vc+a.d/2-T/2,a.w,T,y0,y1);blk(0,vc-a.d/2+T/2,a.w,T,y0,y1);
      blk(a.w/2-T/2,vc,T,a.d-2*T,y0,y1);blk(-a.w/2+T/2,vc,T,a.d-2*T,y0,y1);
    }
    if(b){const h=a.y1,ow=a.w+.8,od=a.d+.8,iw=b.w-2*T-.2,id=b.d-2*T-.2;   // 輪の屋根（外は軒、内は上の段の壁の下まで）
      blk(0,vc+(od+id)/4,ow,(od-id)/2,h,h+.8);blk(0,vc-(od+id)/4,ow,(od-id)/2,h,h+.8);
      blk((ow+iw)/4,vc,(ow-iw)/2,id,h,h+.8);blk(-(ow+iw)/4,vc,(ow-iw)/2,id,h,h+.8);
      const s=Math.min(2.2,inset*.42),cx=a.w/2-inset/2,cz=a.d/2-inset/2;
      for(const sx of[-1,1])for(const sz of[-1,1])sdome(sx*cx,h,vc+sz*cz,s);
    }else{
      p.roofs.push([0,vc,a.w,a.d,H,1]);
      const D=Math.min(11,Math.max(4.5,Math.min(a.w,a.d)*.32));     // 最上段の天井と大ドーム（大きさは最上段に合わせる）
      p.dc.push(['D',0,H+.8,vc,D,D*.667],['M',0,H+.8+D*.667,vc,D*1.044,D*1.28],['F',0,H+.8+D*.667+D*1.28,vc,D*.18]);
      for(const sx of[-1,1])for(const sz of[-1,1])sdome(sx*(a.w/2-3.2),H,vc+sz*(a.d/2-3.2),2.2);
    }
  }
  // ⑤ 装飾: 軒の蛇腹・土台・窓枠・扉枠・胸壁・柱・窓の凹み。箱(p.tb)と円柱(p.tc)は描画側でまとめて描く
  const TB=p.tb=[],TC=p.tc=[],ROT={f:0,b:Math.PI,r:Math.PI/2,l:-Math.PI/2};
  const tb=(u,y,v,sx,sy,sz)=>TB.push([u,y,v,sx,sy,sz]),tc=(u,y,v,r,h)=>TC.push([u,y,v,r,h]);
  // 壁の1面に飾る。n=面の向き(f=+v,b=-v,r=+u,l=-u。室内側の面は内向きの法線)、pc=面の位置、[a0,a1]=面に沿った範囲、ylo〜yhi=高さ
  const face=(n,pc,a0,a1,ylo,yhi,o={})=>{

    const bx=(a,l,y,hh,out)=>{const[u,v]=P(a,pc+sg*out/2);al?tb(u,y+hh/2,v,l,hh,out):tb(u,y+hh/2,v,out,hh,l)};

    if(o.plinth){let cur=a0;for(const g of gaps.slice().sort((x,y)=>x[0]-y[0])){const e=g[0]-g[1]/2-.3;if(e>cur+.1)bx((cur+e)/2,e-cur,ylo,1,.45);cur=Math.max(cur,g[0]+g[1]/2+.3)}if(a1>cur+.1)bx((cur+a1)/2,a1-cur,ylo,1,.45)}   // 土台（扉の所は切る）
    const nb=Math.max(1,Math.floor(len/6)),bl=len/nb;
    for(const w of o.win||[]){for(let i=0;i<nb;i++){                       // 窓: 暗い尖頭アーチの凹み＋枠（両脇の柱・上の楣・下の窓台）

      const y0=ylo+(o.plinth?1:0),y1=yhi-2,[u,v]=P(a,pc+sg*.33);tc(u,(y0+y1)/2,v,.55,y1-y0);bx(a,1.4,y0,.6,1.05);bx(a,1.4,y1-.6,.6,1.05)}

  const mkInst=(geo,mat,list,shadow)=>{
    if(!list.length)return;
    const gg=geo.clone();gg.boundingSphere=new THREE.Sphere(vctr,64);geos.push(gg);          // チャンクの範囲を指定して、画面外のチャンクの木は描かない（背の高い木の分、大きめ）
    const m=new THREE.InstancedMesh(gg,mat,list.length);
    list.forEach((a,i)=>{dummy.position.set(a[0],a[1],a[2]);dummy.rotation.set(0,a[4],0);dummy.scale.set(a[3],a[5],a[3]);dummy.updateMatrix();m.setMatrixAt(i,dummy.matrix);m.setColorAt(i,a[6])});
    m.castShadow=shadow;m.receiveShadow=true;g.add(m);
  };
  mkInst(VEG.pine,vegM,Lpine,true);mkInst(VEG.pineS,vegM,LpineS,true);mkInst(VEG.tree,vegM,Ltree,true);mkInst(VEG.jungle,vegM,Ljung,true);mkInst(VEG.acacia,vegM,Lacac,true);mkInst(VEG.palm,vegM,Lpalm,true);mkInst(rockG,rockV,Lrock,true);
  g.userData.geo=geo;g.userData.geos=geos;g.userData.circ=circ;g.userData.mat=terrain.material;
  scene.add(g);return g;
}
function updateChunks(){
  updatePalaces();
  const pcx=Math.floor(player.x/CHUNK),pcz=Math.floor(player.z/CHUNK);
  for(let dx=-RADIUS;dx<=RADIUS;dx++)for(let dz=-RADIUS;dz<=RADIUS;dz++){
    if(dx*dx+dz*dz>RADIUS*RADIUS+1)continue;
    const k=(pcx+dx)+','+(pcz+dz);
    if(!chunks.has(k))chunks.set(k,makeChunk(pcx+dx,pcz+dz));
  }
  for(const [k,c] of chunks){
    const[x,z]=k.split(',').map(Number);
    if(Math.abs(x-pcx)>RADIUS+1||Math.abs(z-pcz)>RADIUS+1){
      scene.remove(c);disposeChunk(c);chunks.delete(k);
    }
  }
}
function resetWorld(){
  lotCache.clear();townCache.clear();clearPalaces();
  for(const c of chunks.values()){scene.remove(c);disposeChunk(c)}
  chunks.clear();
  const sr=mulberry((SEED^0x5bd1e995)|0);                 // ワールド内のランダムな地点から、街の外の陸地を探してスポーン（街は別の場所にある）
  const bx=(sr()-.5)*8000,bz=(sr()-.5)*8000,ba=sr()*6.283;
  player.x=bx;player.z=bz;
  const townGap=(x,z)=>{                                  // 最寄りの街の端までの距離
    let g=1e9;
    for(const t of nearTowns(x,z)){const dx=x-t.x,dz=z-t.z;g=Math.min(g,Math.hypot(dx,dz)-townEdge(t,Math.atan2(dz,dx)))}
    return g;
  };
  let found=false;
  for(let k=0;k<1500&&!found;k++){                        // 街から120〜1400m離れた陸地を優先
    const a=ba+k*2.4,r=k*6,x=bx+Math.cos(a)*r,z=bz+Math.sin(a)*r,h=heightAt(x,z),gp=townGap(x,z);
    if(townW(x,z)===0&&h>WATER+3&&h<22&&gp>120&&gp<1400){player.x=x;player.z=z;found=true}
  }
  for(let k=0;k<800&&!found;k++){                         // 見つからなければ、街の外の陸地ならどこでも
    const a=ba+k*2.4,r=k*5,x=bx+Math.cos(a)*r,z=bz+Math.sin(a)*r;
    if(townW(x,z)===0&&heightAt(x,z)>WATER+3&&heightAt(x,z)<22){player.x=x;player.z=z;found=true}
  }
  player.yaw=sr()*6.283;player.pitch=0;
  player.gy=Math.max(heightAt(player.x,player.z),WATER-.5);player.y=player.gy+1.7;
  updateEnv(0,true);
}

// ---------- プレイヤー（一人称） ----------
const player={x:0,y:0,z:0,gy:0,yaw:0,pitch:0};
const keys={};let joy={x:0,y:0};
addEventListener('keydown',e=>keys[e.code]=true);
addEventListener('keyup',e=>keys[e.code]=false);
renderer.domElement.addEventListener('click',()=>{if(!('ontouchstart' in window))renderer.domElement.requestPointerLock()});
addEventListener('mousemove',e=>{
  if(document.pointerLockElement){player.yaw-=e.movementX*.0022;player.pitch=Math.max(-1.5,Math.min(1.5,player.pitch-e.movementY*.0022))}
});
// タッチ: 左半分=移動スティック / 右半分=視点
const stick=document.getElementById('stick'),knob=document.getElementById('knob');
let moveId=null,lookId=null,mo={x:0,y:0},lp={x:0,y:0};
if('ontouchstart' in window)stick.style.display='block';
addEventListener('touchstart',e=>{
  for(const t of e.changedTouches){
    if(e.target.tagName==='BUTTON')return;
    if(t.clientX<innerWidth/2&&moveId===null){moveId=t.identifier;mo={x:t.clientX,y:t.clientY}}
    else if(lookId===null){lookId=t.identifier;lp={x:t.clientX,y:t.clientY}}
  }
},{passive:false});
addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===moveId){
      let dx=(t.clientX-mo.x)/50,dy=(t.clientY-mo.y)/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
      joy={x:dx,y:dy};knob.style.transform=`translate(${dx*35}px,${dy*35}px)`;
    }else if(t.identifier===lookId){
      player.yaw-=(t.clientX-lp.x)*.005;player.pitch=Math.max(-1.5,Math.min(1.5,player.pitch-(t.clientY-lp.y)*.005));
      lp={x:t.clientX,y:t.clientY};
    }
  }
},{passive:false});
addEventListener('touchend',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===moveId){moveId=null;joy={x:0,y:0};knob.style.transform=''}
    if(t.identifier===lookId)lookId=null;
  }
});

// ---------- 当たり判定と地面の高さ ----------
// 建物・階段=矩形、柱・ヤシ・岩=円。押し出し方式なので壁沿いに滑る。
// 足元より0.55m高い所までは登れる（階段の段、屋上へ移る時など）。それ以上高い物は壁として扱う。
const STEP=.55,PR=.45;
function collide(){
  const lx=Math.floor(player.x/L),lz=Math.floor(player.z/L),cx=Math.floor(player.x/CHUNK),cz=Math.floor(player.z/CHUNK);
  const rects=[],circs=[];
  for(const t of nearTowns(player.x,player.z)){
    for(const m of t.landmarks)
      if(Math.abs(m.x-player.x)<80&&Math.abs(m.z-player.z)<80){rects.push(m);for(const q of m.circs)circs.push(q)}
    for(const o of t.gates.concat(t.stairs))if(Math.abs(o.x-player.x)<80&&Math.abs(o.z-player.z)<80)rects.push(o);   // 門楼・階段
    const p=t.pal;
    if(Math.hypot(p.x-player.x,p.z-player.z)<260){for(const o of p.rects)rects.push(o);for(const q of p.circs)circs.push(q)}   // 宮殿の壁・塔・生け垣・列柱
  }
  for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){
    const c=chunks.get((cx+dx)+','+(cz+dz));if(c)for(const q of c.userData.circ)circs.push(q);
    const o=lotAt(lx+dx,lz+dz);if(!o)continue;
    if(o.circs)for(const q of o.circs)circs.push(q);
    if(o.type==='b'){rects.push(o);if(o.stair)for(const t of o.stair.treads)rects.push(t);for(const b of o.bridges)rects.push(b)}
  }
  const ground=()=>{
    let gy=Math.max(heightAt(player.x,player.z),WATER-.5);
    for(const o of rects)if(o.top>gy&&o.top<=player.gy+STEP+.01&&Math.abs(player.x-o.x)<o.w/2&&Math.abs(player.z-o.z)<o.d/2)gy=o.top;
    if(TOWN_H>gy&&TOWN_H<=player.gy+STEP+.01&&bridgeAt(player.x,player.z))gy=TOWN_H;   // 水路の橋の上（水路の底からは登れない）
    const di=deckInfo(player.x,player.z);                                       // 橋の上面（足元+STEPまでなら登れる）
    if(di&&di.h>.01&&TOWN_H+di.h>gy&&TOWN_H+di.h<=player.gy+STEP+.01)gy=TOWN_H+di.h;
    player.gy=gy;
  };
  ground();
  const di=deckInfo(player.x,player.z),onDeck=di&&di.h>.8&&player.gy>=TOWN_H+di.h-STEP-.01;
  if(onDeck){                                                                   // 橋の上: 欄干で両脇を止める（下の建物・柱とは当たらない）
    const v=di.zr?player.x:player.z,lim=RW/2-.95,u=Math.max(di.c-lim,Math.min(di.c+lim,v));
    if(di.zr)player.x=u;else player.z=u;
    return;
  }
  if(di&&di.ramp&&TOWN_H+di.h>player.gy+STEP){                                  // 傾斜路の脇や高い側から入ったら横へ押し出す（傾斜路は中身の詰まった土台）
    const v=di.zr?player.x:player.z,u=di.c+(v<di.c?-1:1)*(RW/2+PR+.05);
    if(di.zr)player.x=u;else player.z=u;
  }
  for(let it=0;it<3;it++){
    for(const o of rects){
      if(o.walk||player.gy>=o.top-STEP||(o.bot!==undefined&&player.gy+1.8<=o.bot))continue;
      const hx=o.w/2+o.m,hz=o.d/2+o.m,dx=player.x-o.x,dz=player.z-o.z;
      if(Math.abs(dx)<hx&&Math.abs(dz)<hz){
        const px=hx-Math.abs(dx),pz=hz-Math.abs(dz);
        if(px<pz)player.x+=(dx<0?-1:1)*px;else player.z+=(dz<0?-1:1)*pz;
      }
    }
    for(const[qx,qz,qr,qh] of circs){
      if(qh!==undefined&&player.gy>=qh-STEP)continue;      // 壁・橋の土台の上に立っているときは、その壁には当たらない
      const dx=player.x-qx,dz=player.z-qz,d=Math.hypot(dx,dz),m=qr+PR;
      if(d<m){if(d>1e-4){player.x+=dx/d*(m-d);player.z+=dz/d*(m-d)}else player.x+=m}
    }
  }
  ground();
}

// ---------- 最寄りの街の方角表示 ----------
const navEl=document.getElementById('nav');
function updateNav(){
  const ix=Math.floor(player.x/TCELL),iz=Math.floor(player.z/TCELL);
  let best=null,bd=1e9;
  for(let a=-4;a<=4;a++)for(let b=-4;b<=4;b++){
    const t=townOfCell(ix+a,iz+b);if(!t)continue;
    for(const q of [t,t.city].filter(Boolean)){const d=Math.hypot(q.x-player.x,q.z-player.z);if(d<bd){bd=d;best=q}}
  }
  if(!best){navEl.textContent='';return}
  if(townIn(player.x,player.z,0)){navEl.textContent='街の中';return}
  const dx=best.x-player.x,dz=best.z-player.z,sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);
  const rel=Math.atan2(dx*cy-dz*sy,-dx*sy-dz*cy);
  navEl.innerHTML=`<span style="display:inline-block;transform:rotate(${rel}rad)">↑</span> 最寄りの街の中心まで約${Math.round(bd)}m`;
}

// ---------- デバッグ: バイオーム・建物へワープ ----------
// 「デバッグ」ボタン（PCはPキーでも開閉）でパネルを開く。バイオームは今いる所から近い順に探し、同じ所にいる時は800m以上離れた別の場所へ飛ぶ。
// 建物は近い街から順に、押すたびに次の場所へ（街の宮殿（広場・本殿の中・背面・正面）・大建築・外壁の門・橋・商店街）。
const dbgBox=document.getElementById('dbg'),dbgVisited={};let dbgMsg=null,dbgOpen=false;
function warpTo(x,z,yaw,gy){
  player.x=x;player.z=z;player.yaw=yaw;player.pitch=0;
  player.gy=gy===undefined?Math.max(heightAt(x,z),WATER-.5):gy;player.y=player.gy+1.7;   // 橋の上などは高さを指定（足元+STEPまでの面にしか乗れないため）
  updateChunks();updateEnv(0,true);collide();player.y=player.gy+1.7;
}
function warpBiome(key,name){
  const px=player.x,pz=player.z,here=climateAt(px,pz)[key];
  let found=null,best=null,bw=0;
  for(let r=here>.85?800:60;r<=40000&&!found;r+=r<2000?120:300){
    const step=r<2000?120:300,n=Math.max(8,Math.ceil(6.2832*r/step)),off=Math.random()*6.2832;   // 毎回違う向きから探す
    for(let i=0;i<n;i++){
      const a=off+i/n*6.2832,x=px+Math.cos(a)*r,z=pz+Math.sin(a)*r,w=climateAt(x,z)[key];
      if(w<.85&&w<=bw)continue;
      const h=heightAt(x,z);if(h<WATER+2||h>16||townW(x,z)>0)continue;       // 陸で、街の近くでない所
      if(w>=.85){found=[x,z];break}
      bw=w;best=[x,z];
    }
  }
  const p=found||(bw>.4?best:null);
  if(!p){dbgMsg.textContent=name+': 見つかりません（半径40km以内）';return}
  warpTo(p[0],p[1],Math.random()*6.2832);
  dbgMsg.textContent=`${name}へ移動（${biomeName()}${found?'':'・境目付近'}）`;
}
function dbgTowns(){                                              // 近い順の街（3つ以上見つかるまで外側へ広げる。最大±9区画）
  const cx=Math.floor(player.x/TCELL),cz=Math.floor(player.z/TCELL),out=[];
  for(let ring=0;ring<=9;ring++){
    for(let a=-ring;a<=ring;a++)for(let b=-ring;b<=ring;b++){if(Math.max(Math.abs(a),Math.abs(b))!==ring)continue;const t=townOfCell(cx+a,cz+b);if(t)out.push(t)}
    if(out.length>=3&&ring>=2)break;
  }
  return out.sort((p,q)=>Math.hypot(p.x-player.x,p.z-player.z)-Math.hypot(q.x-player.x,q.z-player.z));
}
const yawTo=(dx,dz)=>Math.atan2(-dx,-dz);                          // (dx,dz)の方を向くyaw（前=(-sin yaw,-cos yaw)）
const DBG_B=[
  ['plaza','宮殿・広場',t=>{const p=t.pal,[x,z]=palW(p,0,20);return[{x,z,yaw:p.th}]}],                 // 本殿に向かって、U字の建物に囲まれた広場
  ['hall','宮殿・本殿の中',t=>{const p=t.pal,[x,z]=palW(p,0,p.hv+4);return[{x,z,yaw:p.th}]}],           // 吹き抜けの真ん中から奥の壁を向く
  ['back','宮殿・背面',t=>{const p=t.pal,[x,z]=palW(p,0,-72);return[{x,z,yaw:p.th+Math.PI}]}],            // 青い壁の奥の外から、本殿の背面を見上げる
  ['front','宮殿・正面',t=>{const p=t.pal,[x,z]=palW(p,0,72);return[{x,z,yaw:p.th}]}],                // 青い壁の正門の前
  ['grand','大建築',t=>t.landmarks.filter(m=>m.grand).map(m=>({x:m.x,z:m.z+m.d/2+7,yaw:0}))],         // 大モスク風の建物の正面
  ['gate','外壁の門',t=>t.roads.map(q=>{const zr=q.ax==='z',s=q.s1+12;return{x:zr?q.c:t.x+q.sg*s,z:zr?t.z+q.sg*s:q.c,yaw:zr?yawTo(0,-q.sg):yawTo(-q.sg,0)}})],   // 壁の外から街の中を向く
  ['bridge','橋の上',t=>t.roads.map(q=>{const zr=q.ax==='z',s=(q.sf+q.s1-16)/2;return{x:zr?q.c:t.x+q.sg*s,z:zr?t.z+q.sg*s:q.c,yaw:zr?yawTo(0,q.sg):yawTo(q.sg,0),gy:TOWN_H+DH}})],   // 宮殿から外壁へ伸びる主要な道の橋
  ['shop','商店街',t=>t.bz.map(b=>{const m=(b.a0+b.a1)/2,ax=b.ax==='x';return{x:ax?m:b.k*L,z:ax?b.k*L:m,yaw:ax?yawTo(1,0):yawTo(0,1)}})]
];
function warpBuilding(type,name,fn){
  const ts=dbgTowns();
  if(!ts.length){dbgMsg.textContent=name+': 近くに街がありません';return}
  const list=[];
  for(const t of ts){const d0=Math.hypot(t.x-player.x,t.z-player.z);for(const c of fn(t))list.push({c,d:d0+Math.hypot(c.x-t.x,c.z-t.z)*.001})}    // 街の近い順（同じ街の中では順不同）
  if(!list.length){dbgMsg.textContent=name+': この付近の街には無い';return}
  const vis=dbgVisited[type]||(dbgVisited[type]=new Set()),key=o=>Math.round(o.c.x)+','+Math.round(o.c.z);
  let pick=list.find(o=>!vis.has(key(o)));if(!pick){vis.clear();pick=list[0]}
  vis.add(key(pick));
  const c=pick.c;warpTo(c.x,c.z,c.yaw,c.gy);
  dbgMsg.textContent=`${name}へ移動（${vis.size}/${list.length}か所目・街まで約${Math.round(pick.d)}m）`;
}
{
  const H=t=>{const d=document.createElement('div');d.className='h';d.textContent=t;dbgBox.appendChild(d)};
  const B=(label,fn)=>{const b=document.createElement('button');b.textContent=label;b.onclick=fn;dbgBox.appendChild(b)};
  H('バイオームへワープ');for(const[k,n] of COVER_NAMES)B(n,()=>warpBiome(k,n));
  H('建物へワープ');for(const[k,n,f] of DBG_B)B(n,()=>warpBuilding(k,n,f));
  dbgMsg=document.createElement('div');dbgMsg.id='dbgmsg';dbgBox.appendChild(dbgMsg);
  const toggle=()=>{dbgOpen=!dbgOpen;dbgBox.style.display=dbgOpen?'block':'none';if(dbgOpen&&document.exitPointerLock)document.exitPointerLock()};   // PCはポインタを解放してクリックできるように
  document.getElementById('dbgBtn').onclick=toggle;
  addEventListener('keydown',e=>{if(e.code==='KeyP')toggle()});
}

// ---------- ループ ----------
const info=document.getElementById('info');
document.getElementById('regen').onclick=()=>{SEED=Math.floor(Math.random()*1e9);resetWorld()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();fitRes()});
resetWorld();
let last=performance.now(),frame=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  let fx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x,fz=(keys.KeyS?1:0)-(keys.KeyW?1:0)+joy.y;
  const l=Math.hypot(fx,fz);if(l>1){fx/=l;fz/=l}
  const speed=(keys.ShiftLeft?14:7)*dt,s=Math.sin(player.yaw),c=Math.cos(player.yaw);
  const mx=(fx*c+fz*s)*speed,mz=(-fx*s+fz*c)*speed,ns=Math.max(1,Math.ceil(Math.hypot(mx,mz)/.1));   // 1回に0.1mより大きく動かさない（階段・壁のすり抜け防止）
  for(let i=0;i<ns;i++){player.x+=mx/ns;player.z+=mz/ns;collide()}
  player.y+=(player.gy+1.7-player.y)*Math.min(1,dt*12);
  camera.position.set(player.x,player.y,player.z);
  camera.rotation.set(player.pitch,player.yaw,0);
  water.position.x=player.x;water.position.z=player.z;
  updateEnv(dt);
  if(frame++%10===0){updateChunks();info.textContent=`seed:${SEED}  chunks:${chunks.size}  ${biomeName()}`;updateNav()}
  const tx=Math.round(player.x/.0586)*.0586,tz=Math.round(player.z/.0586)*.0586;   // 影のちらつき防止（テクセルにスナップ）
  sun.target.position.set(tx,0,tz);sun.position.set(tx+SUN_OFF.x,SUN_OFF.y,tz+SUN_OFF.z);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
