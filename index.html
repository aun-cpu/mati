<style>

  #mini.big canvas{width:min(100vw,100vh);height:min(100vw,100vh);width:min(100vw,100dvh);height:min(100vw,100dvh)}
  #mini.big #mapcap{display:block;position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);color:#fff;font-size:12px;text-align:center;text-shadow:0 1px 3px #000;pointer-events:none}
  #mapbtns{display:none}

  #knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.5)}
</style>

<body>
<div id="ui"><div id="info"></div><div id="nav" style="font-size:13px"></div><button id="regen">新しいマップ</button> <button id="dbgBtn">デバッグ</button><div id="dbg"></div><div>PC: クリックで操作 / WASD+Shift　スマホ: 左=移動 右=視点</div></div>

<div id="mini"><canvas id="miniC" width="240" height="240"></canvas><div id="mapcap"></div><div id="mapbtns"><button id="mapHere">現在地</button> <button id="mapNew">新しいマップ</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<script>
// ---------- 乱数・ノイズ ----------
let SEED = Math.floor(Math.random()*1e9);
function hash(x,y,s){let h=(x*374761393+y*668265263+s*2147483647)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)/4294967295}
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,SEED),b=hash(xi+1,yi,SEED),c=hash(xi,yi+1,SEED),d=hash(xi+1,yi+1,SEED);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y){let s=0,a=.5,f=1;for(let i=0;i<5;i++){s+=a*vnoise(x*f,y*f);f*=2;a*=.5}return s}
// 街: ワールドを TCELL(m) 四方のセルに分け、セルごとに70%で1つ、ランダムな位置・大きさ(半径500〜850m=直径1〜1.7km)・形の巨大な街ができる
// スポーン地点とは無関係に決まる（スポーンは街の外）。街同士が重ならないよう、中心のずれ幅はセルの30%まで。
const GEN_OTHER_TOWNS=false;   // 砂漠の街以外（川沿いの村・港町・西洋の都市・屋敷・教会・修道院・帝国）の生成。false=生成しない（コードとデータはそのまま残してある）。true にすると元に戻る
const MS=2;                                                      // 屋敷の規模の倍率（建物・庭・フェンス・当たり判定・配置まで全部）
const TOWN_H=3,L=14,TCELL=3600,TBLEND=150,TOWN_P=.24,CITY_P=.075;      // L=1区画の大きさ
const townCache=new Map();
// 政体ラベル: 宮殿/城 > 屋敷 > なし。構造物の有無から毎回判定し、今後生成される集落にも適用する。
function settlementLabel(o,type){
  if(type==='village') return '村';
  if(type==='port') return '港町';
  if(type==='kingdom') return '王国';
  if(type==='city') return o.manor ? '公国' : '共和国';
  return o.manor ? '公国' : '共和国';
}
// 街の構成（中心から外へ）:
//  ① 中心: 四角い城壁（ミナレット付き）に囲まれた、とても大きな宮殿
//  ② 内壁（街の輪郭を縮めた形）までの広場: 庭とヤシ
//  ③ 内壁と外壁のあいだ: 入り組んだ路地の地区（建物・中庭・大モスク風の大建築）
//  ④ 外壁（街の輪郭に沿う）
// 東西南北に伸びる幅RW(m)の主要な道が、宮殿の城壁・内壁・外壁を門で通り抜ける。
const RW=12,INNER_K=.48,GW=9;
const DH=12,SLOPE=3.5,RL=DH*SLOPE,TUN=8,RGATE=8,TOWER_OFF=9.6;   // 橋の高さ / 勾配(1:3.5) / 橋の下の通路幅 / 内外壁の門(小片の中心がこれ未満なら省く) / 門塔の位置                                   // 主要な道の幅 / 内壁の半径=外壁の半径×INNER_K / 門の開口の目安(道の中心からGW)
function roadClip(t,cx,cz,ex,ez,strict){                       // 橋の下の通路・傾斜路の敷地・(strict)橋の真下に、置いてはいけない物がかかるか
  for(const q of t.roads){
    const zr=q.ax==='z',pp=zr?cx:cz,pe=zr?ex:ez,al=zr?cz:cx,ae=zr?ez:ex,off=Math.abs(pp-q.c)-pe,m=q.sg*(al-(zr?t.z:t.x)),a=m-ae,b=m+ae;
    if(b>q.sf&&a<q.s1&&off<(strict?RW/2+2:TUN/2))return true;
    if(b>q.s0-8&&a<q.sf&&off<RW/2+2)return true;
  }
  return false;
}
function underDeck(t,cx,cz,ex,ez){                              // 橋桁（平らな部分）の真下にかかるか
  for(const q of t.roads){
    const zr=q.ax==='z',pp=zr?cx:cz,pe=zr?ex:ez,al=zr?cz:cx,ae=zr?ez:ex,m=q.sg*(al-(zr?t.z:t.x));
    if(m+ae>q.sf&&m-ae<q.s1&&Math.abs(pp-q.c)-pe<RW/2+1.2)return true;
  }
  return false;
}
function deckInfo(x,z){                                         // 橋の上面の高さ(TOWN_Hからの高さ)。傾斜路ならramp=true。橋は外壁の門楼の外側の面で終わる
  for(const t of nearTowns(x,z))for(const q of t.roads){
    const zr=q.ax==='z',pp=zr?x:z;
    if(Math.abs(pp-q.c)>=RW/2)continue;
    const s=q.sg*((zr?z:x)-(zr?t.z:t.x));
    if(s<q.s0||s>q.s1)continue;
    return{h:DH,ramp:false,zr,c:q.c,s,s1:q.s1,ctr:zr?t.z:t.x,sg:q.sg};
  }
  return null;
}
const PAL={WW:44,CW:30,WH:15,CH:30,DW:24,DC:30,W:118};          // 翼棟の幅・中央棟の幅・翼棟の高さ・中央棟の高さ・翼棟の奥行・中央棟の奥行・全幅（k=1の大きさ。実際は街の大きさに合わせて拡大）
function palW(p,u,v){const c=Math.cos(p.th),s=Math.sin(p.th);u*=p.k;v*=p.k;return [p.x+u*c+v*s,p.z-u*s+v*c]}   // 宮殿の局所座標(u=横,v=正面方向)→ワールド（k倍）
function palL(p,x,z){const c=Math.cos(p.th),s=Math.sin(p.th),dx=x-p.x,dz=z-p.z;return [(dx*c-dz*s)/p.k,(dx*s+dz*c)/p.k]}
function palRect(p,u,v,w,d,h,m){const[x,z]=palW(p,u,v),sw=Math.abs(Math.sin(p.th))>.5,k=p.k;return{x,z,w:(sw?d:w)*k,d:(sw?w:d)*k,top:TOWN_H+DH+h*k,m:m===undefined?.3:m}}
const HALL_TIERS=[2,5];                                          // 本殿の段数の範囲（最小,最大）。街ごとにこの範囲でランダム
const BLUE={u:62,v0:-62,v1:58,g:22},PLAZA=25,BAR_W=48;           // 青い壁（宮殿を囲む追加の壁）: 局所座標の左右±u・奥v0・手前v1・正面の門の半幅g / 広場の半幅 / U字の建物の半幅
function makePalace(t,fx,fz,k){                                   // 宮殿（局所座標 u=横, v=正面(+)）: 奥に本殿(1)、その左右にすき間なく続く建物(2)、手前に広場(3)を囲むU字の建物。全体が u=0 の軸で左右対称
  const p={x:t.x,z:t.z,th:Math.atan2(fx,fz),k,rects:[],circs:[],bx:[],roofs:[],dc:[],wings:[],arcs:[]};
  const r=mulberry(hash(Math.round(t.x),Math.round(t.z),SEED+55)*1e9|0),T=1.2,DR=9;
  const R=(u,v,w,d,h,m)=>p.rects.push(palRect(p,u,v,w,d,h,m));
  const blk=(u,v,w,d,y0,y1)=>{p.bx.push([u,v,w,d,y0,y1]);if(!y0)R(u,v,w,d,y1)};
  const W=(u0,u1,v0,v1,h)=>({u0,u1,v0,v1,h,skip:{},doors:{l:[],r:[],f:[],b:[]}});
  const sdome=(x,y,z,s)=>p.dc.push(['D',x,y+.8,z,s,1.8*s],['M',x,y+.8+1.8*s,z,1.18*s,1.45*s],['F',x,y+.8+1.8*s+1.45*s,z,.36*s]);   // 小ドーム（y=屋根の下面の高さ）
  // ① 本殿: 奥(v=-55)に接して置く、n段の階段状の塔。各段は壁で囲み、屋根は縁の輪だけ（中央はあけて）、全段ぶち抜きの吹き抜け
  const hw=56+r()*10,hd=34+r()*6,n=HALL_TIERS[0]+Math.floor(r()*(HALL_TIERS[1]-HALL_TIERS[0]+1)),VB=-55,vc=VB+hd/2;p.hv=vc;   // p.hv=本殿の中心のv（デバッグのワープ用）
  const h0=17+r()*3,th=8.5+r()*2.5,inset=Math.min(5,(Math.min(hw,hd)/2-7)/(n-1));
  const tiers=[];for(let i=0;i<n;i++){const y0=i?h0+(i-1)*th:0;tiers.push({w:hw-2*inset*i,d:hd-2*inset*i,y0,y1:i?y0+th:h0})}
  const hall=W(-hw/2,hw/2,VB,VB+hd,h0),all=[hall],H=tiers[n-1].y1;
  hall.doors.f.push([0,10]);hall.noArcs=true;
  // ② 本殿の左右にすき間なく続く建物（本殿との境の壁に扉）
  const w2=20+r()*3,d2=hd*.8,h2=11+r()*5,dome2=r()<.5;
  for(const sd of[-1,1]){
    const a=sd*hw/2,b=sd*(hw/2+w2),wg=W(Math.min(a,b),Math.max(a,b),VB,VB+d2,h2);
    wg.skip[sd>0?'l':'r']=true;wg.dome=dome2;hall.doors[sd>0?'r':'l'].push([VB+d2/2,6]);all.push(wg);
  }
  // ③ 広場を囲むU字の建物: 本殿の手前に横長の棟、その両端から手前へ脚が伸びる。扉は 本殿→横長の棟→広場
  const bh=10+r()*3,b0=hall.v1,b1=b0+18,LEG=42,mid=(PLAZA+BAR_W)/2;
  const bar=W(-BAR_W,BAR_W,b0,b1,bh);bar.doors.b.push([0,10]);bar.doors.f.push([-mid,6],[0,10],[mid,6]);bar.arcRange=[-PLAZA,PLAZA];all.push(bar);
  for(const sd of[-1,1]){const a=sd*PLAZA,b=sd*BAR_W,leg=W(Math.min(a,b),Math.max(a,b),b1,b1+LEG,bh-.5);leg.skip.b=true;all.push(leg)}
  for(const wg of all){                                             // 壁（扉の上は楣）・窓・屋根
    const{u0,u1,v0,v1,h}=wg,uc=(u0+u1)/2,vcw=(v0+v1)/2,w=u1-u0,d=v1-v0;
    const wall=(sideKey,fixed,a0,a1,alongU)=>{
      if(wg.skip[sideKey])return;const ds=wg.doors[sideKey].slice().sort((a,b)=>a[0]-b[0]);let cur=a0;
      const put=(x0,x1,y0,y1)=>{if(x1-x0>.01)alongU?blk((x0+x1)/2,fixed,x1-x0,T,y0,y1):blk(fixed,(x0+x1)/2,T,x1-x0,y0,y1)};
      for(const[c,dw] of ds){put(cur,c-dw/2,0,h);put(c-dw/2,c+dw/2,DR,h);cur=c+dw/2}put(cur,a1,0,h);
    };
    const sa=wg.skip.b?v0:v0+T,sb=wg.skip.f?v1:v1-T;                  // 脚は奥の壁を持たない（横長の棟の壁と一続き）ので、側壁を奥の端まで伸ばす
    wall('f',v1-T/2,u0,u1,true);wall('b',v0+T/2,u0,u1,true);wall('l',u0+T/2,sa,sb,false);wall('r',u1-T/2,sa,sb,false);
    p.wings.push([uc,vcw,w,d]);
    if(wg!==hall){
      p.roofs.push([uc,vcw,w,d,h,1]);if(wg.dome){const R2=Math.min(w,d)*.28;p.dc.push(['D',uc,h+.8,vcw,R2*.8,3],['M',uc,h+3.8,vcw,R2,R2*1.1])}
    }
  }
  // ④ 本殿の2段目以上の壁と、各段の屋根（縁だけの輪。中央は吹き抜け）、最上段の天井と大ドーム
  for(let i=0;i<n;i++){
    const a=tiers[i],b=tiers[i+1];
    if(i>0){const y0=a.y0+.4,y1=a.y1;                               // 壁（前の段の屋根の板に少し埋める）
      blk(0,vc+a.d/2-T/2,a.w,T,y0,y1);blk(0,vc-a.d/2+T/2,a.w,T,y0,y1);
      blk(a.w/2-T/2,vc,T,a.d-2*T,y0,y1);blk(-a.w/2+T/2,vc,T,a.d-2*T,y0,y1);
    }
    if(b){const h=a.y1,ow=a.w+.8,od=a.d+.8,iw=b.w-2*T-.2,id=b.d-2*T-.2;   // 輪の屋根（外は軒、内は上の段の壁の下まで）
      blk(0,vc+(od+id)/4,ow,(od-id)/2,h,h+.8);blk(0,vc-(od+id)/4,ow,(od-id)/2,h,h+.8);
      blk((ow+iw)/4,vc,(ow-iw)/2,id,h,h+.8);blk(-(ow+iw)/4,vc,(ow-iw)/2,id,h,h+.8);
      const s=Math.min(2.2,inset*.42),cx=a.w/2-inset/2,cz=a.d/2-inset/2;
      for(const sx of[-1,1])for(const sz of[-1,1])sdome(sx*cx,h,vc+sz*cz,s);
    }else{
      p.roofs.push([0,vc,a.w,a.d,H,1]);
      const D=Math.min(11,Math.max(4.5,Math.min(a.w,a.d)*.32));     // 最上段の天井と大ドーム（大きさは最上段に合わせる）
      p.dc.push(['D',0,H+.8,vc,D,D*.667],['M',0,H+.8+D*.667,vc,D*1.044,D*1.28],['F',0,H+.8+D*.667+D*1.28,vc,D*.18]);
      for(const sx of[-1,1])for(const sz of[-1,1])sdome(sx*(a.w/2-3.2),H,vc+sz*(a.d/2-3.2),2.2);
    }
  }
  // ⑤ 装飾: 軒の蛇腹・土台・窓枠・扉枠・胸壁・柱・窓の凹み。箱(p.tb)と円柱(p.tc)は描画側でまとめて描く
  const TB=p.tb=[],TC=p.tc=[],ROT={f:0,b:Math.PI,r:Math.PI/2,l:-Math.PI/2};
  const tb=(u,y,v,sx,sy,sz)=>TB.push([u,y,v,sx,sy,sz]),tc=(u,y,v,r,h)=>TC.push([u,y,v,r,h]);
  // 壁の1面に飾る。n=面の向き(f=+v,b=-v,r=+u,l=-u。室内側の面は内向きの法線)、pc=面の位置、[a0,a1]=面に沿った範囲、ylo〜yhi=高さ
  const face=(n,pc,a0,a1,ylo,yhi,o={})=>{
    const al=n==='f'||n==='b',sg=(n==='f'||n==='r')?1:-1,P=(a,q)=>al?[a,q]:[q,a],len=a1-a0,gaps=o.gaps||[];
    const bx=(a,l,y,hh,out)=>{const[u,v]=P(a,pc+sg*out/2);al?tb(u,y+hh/2,v,l,hh,out):tb(u,y+hh/2,v,out,hh,l)};
    const free=(a,hw)=>!gaps.some(g=>Math.abs(a-g[0])<g[1]/2+hw);
    if(o.cornice!==false){bx((a0+a1)/2,len+.2,yhi-1.9,.45,.4);bx((a0+a1)/2,len+.2,yhi-1.45,.45,.6)}   // 軒の下の蛇腹（二段）
    if(o.plinth){let cur=a0;for(const g of gaps.slice().sort((x,y)=>x[0]-y[0])){const e=g[0]-g[1]/2-.3;if(e>cur+.1)bx((cur+e)/2,e-cur,ylo,1,.45);cur=Math.max(cur,g[0]+g[1]/2+.3)}if(a1>cur+.1)bx((cur+a1)/2,a1-cur,ylo,1,.45)}   // 土台（扉の所は切る）
    const nb=Math.max(1,Math.floor(len/6)),bl=len/nb;
    for(const w of o.win||[]){for(let i=0;i<nb;i++){                       // 窓: 暗い尖頭アーチの凹み＋枠（両脇の柱・上の楣・下の窓台）
      const a=a0+(i+.5)*bl;if(!free(a,w.sx/2+1))continue;
      const[u,v]=P(a,pc+sg*.05);p.arcs.push([u,w.y,v,w.sx,w.sy,ROT[n]]);
      for(const s2 of[-1,1])bx(a+s2*(w.sx/2+.35),.55,w.y-.3,w.sy+.8,.35);
      bx(a,w.sx+1.5,w.y+w.sy+.05,.45,.5);bx(a,w.sx+1.2,w.y-.35,.35,.55);
    }}
    if(o.cols)for(let i=0;i<=nb;i++){const a=a0+i*bl;if(!free(a,.9))continue;   // 壁付きの柱（土台・柱身・柱頭）
      const y0=ylo+(o.plinth?1:0),y1=yhi-2,[u,v]=P(a,pc+sg*.33);tc(u,(y0+y1)/2,v,.55,y1-y0);bx(a,1.4,y0,.6,1.05);bx(a,1.4,y1-.6,.6,1.05)}
    for(const[a,w] of o.doors||[]){for(const s2 of[-1,1])bx(a+s2*(w/2+.35),.7,0,DR+.9,.6);bx(a,w+1.9,DR,.9,.6)}   // 扉枠

// 足元より0.55m高い所までは登れる（階段の段、屋上へ移る時など）。それ以上高い物は壁として扱う。
const STEP=.55,PR=.45;
function collide(){
  const lx=Math.floor(player.x/L),lz=Math.floor(player.z/L),cx=Math.floor(player.x/CHUNK),cz=Math.floor(player.z/CHUNK);
  const rects=[],circs=[];
  {const cv=caravanNear(player.x,player.z)||caravanOfCell(Math.floor(player.x/CVC),Math.floor(player.z/CVC));      // キャラバンサライの壁・塔・荷・テント
   if(cv&&Math.abs(cv.x-player.x)<170&&Math.abs(cv.z-player.z)<170){for(const o of cv.rects)rects.push(o);for(const q of cv.circs)circs.push(q)}}
  {const et=euroNear(player.x,player.z);                                                                // 西洋の都市の噴水・建物
   if(et){for(const q of et.fcircs||[])if(Math.abs(q[0]-player.x)<40&&Math.abs(q[1]-player.z)<40)circs.push(q);for(const q of et.wallc||[])if(Math.abs(q[0]-player.x)<40&&Math.abs(q[1]-player.z)<40)circs.push(q);for(const q of et.fc)circs.push(q);if(et.church)for(const q of et.church.circs)if(Math.abs(q[0]-player.x)<40&&Math.abs(q[1]-player.z)<40)circs.push(q);if(et.manor&&et.manor.circs)for(const q of et.manor.circs)if(Math.abs(q[0]-player.x)<40&&Math.abs(q[1]-player.z)<40)circs.push(q);for(const b of et.bld)if(Math.abs(b.ax-player.x)<30&&Math.abs(b.az-player.z)<30)for(const q of b.circs||[])circs.push(q)}}
  for(const v of VLIST){if(!v.houses||Math.hypot(v.cx-player.x,v.cz-player.z)>300)continue;if(v.fcircs)for(const q of v.fcircs)if(Math.abs(q[0]-player.x)<40&&Math.abs(q[1]-player.z)<40)circs.push(q);if(v.church)for(const q of v.church.circs)if(Math.abs(q[0]-player.x)<40&&Math.abs(q[1]-player.z)<40)circs.push(q);for(const b of v.houses)if(Math.abs(b.x-player.x)<30&&Math.abs(b.z-player.z)<30)for(const q of b.circs)circs.push(q);if(v.deck)for(const o of v.deck)if(Math.abs(o.x-player.x)<40&&Math.abs(o.z-player.z)<40)rects.push(o)}   // 川沿いの村の家・橋の床
  for(const t of nearTowns(player.x,player.z)){
    for(const m of t.landmarks)

    for(const o of t.gates.concat(t.stairs))if(Math.abs(o.x-player.x)<80&&Math.abs(o.z-player.z)<80)rects.push(o);   // 門楼・階段

  }

  player.x=x;player.z=z;player.yaw=yaw;player.pitch=0;
  player.gy=gy===undefined?Math.max(heightAt(x,z),WATER-.5):gy;player.y=player.gy+1.7;   // 橋の上などは高さを指定（足元+STEPまでの面にしか乗れないため）

function warpBiome(key,name,hmax){
  const px=player.x,pz=player.z,here=climateAt(px,pz)[key];
  let found=null,best=null,bw=0;
  for(let r=here>.85?800:60;r<=40000&&!found;r+=r<2000?120:300){
    const step=r<2000?120:300,n=Math.max(8,Math.ceil(6.2832*r/step)),off=Math.random()*6.2832;   // 毎回違う向きから探す
    for(let i=0;i<n;i++){
      const a=off+i/n*6.2832,x=px+Math.cos(a)*r,z=pz+Math.sin(a)*r,w=climateAt(x,z)[key];
      if(w<.85&&w<=bw)continue;
      const h=heightAt(x,z);if(h<WATER+2||h>(hmax||16)||townW(x,z)>0)continue;       // 陸で、街の近くでない所
      if(w>=.85){found=[x,z];break}
      bw=w;best=[x,z];
    }
  }
  const p=found||(bw>.4?best:null);
  if(!p){dbgMsg.textContent=name+': 見つかりません（半径40km以内）';return}
  warpTo(p[0],p[1],Math.random()*6.2832);
  dbgMsg.textContent=`${name}へ移動（${biomeName()}${found?'':'・境目付近'}）`;
}
function dbgCells(fn,size,ring){                                  // 近い順のセル（盆地・台地）。fn(i,j)がnullでないものだけ
  const cx=Math.floor(player.x/size),cz=Math.floor(player.z/size),out=[];
  for(let a=-ring;a<=ring;a++)for(let b=-ring;b<=ring;b++){const o=fn(cx+a,cz+b);if(o)out.push(o)}
  return out.sort((p,q)=>Math.hypot(p.x-player.x,p.z-player.z)-Math.hypot(q.x-player.x,q.z-player.z));
}
function warpCells(tag,list,name,place){                         // 押すたびに次の場所へ
  if(!list.length){dbgMsg.textContent=name+': 近くにありません（±5セル）';return}
  const vis=dbgVisited[tag]||(dbgVisited[tag]=new Set()),key=m=>Math.round(m.x)+','+Math.round(m.z);
  let pick=list.find(m=>!vis.has(key(m)));if(!pick){vis.clear();pick=list[0]}
  vis.add(key(pick));place(pick);
  dbgMsg.textContent=`${name}へ移動（${vis.size}/${list.length}か所目・約${Math.round(Math.hypot(pick.x-player.x,pick.z-player.z))}m）`;
}
function warpBasin(){                                             // 盆地の床の中。開く側を背にして、囲む絶壁を向く
  warpCells('basin',dbgCells(basinOfCell,BC,5),'盆地',b=>warpTo(b.x+Math.cos(b.th)*b.R*.35,b.z+Math.sin(b.th)*b.R*.35,yawTo(-Math.cos(b.th),-Math.sin(b.th))));
}
function warpMesa(){                                              // 台地の上面の縁の近く。外（崖の向こう）を向く
  warpCells('mesa',dbgCells(mesaOfCell,MC2,5),'台地',m=>{const a=Math.random()*6.2832;warpTo(m.x+Math.cos(a)*m.R*.55,m.z+Math.sin(a)*m.R*.55,yawTo(Math.cos(a),Math.sin(a)))});
}
function warpFall(){                                              // 滝。下流16mから滝を向く（近くの山の川を先に作ってから探す）
  for(const m of dbgMountains(6,6))mtRivers(m);
  ensureRivers(player.x,player.z);
  const list=FALL_LIST.slice().sort((p,q)=>Math.hypot(p.x-player.x,p.z-player.z)-Math.hypot(q.x-player.x,q.z-player.z));
  warpCells('fall',list,'滝',pl=>warpTo(pl.B.x+pl.ux*16,pl.B.z+pl.uz*16,yawTo(-pl.ux,-pl.uz)));
}
function warpPlain(){                                             // 海岸平野。内陸側を向く（段々の崖が見える）
  const px=player.x,pz=player.z;
  for(let r=300;r<=40000;r+=r<3000?200:500){
    const step=r<3000?200:500,n=Math.max(8,Math.ceil(6.2832*r/step)),off=Math.random()*6.2832;
    for(let i=0;i<n;i++){
      const a=off+i/n*6.2832,x=px+Math.cos(a)*r,z=pz+Math.sin(a)*r,cd=contD(x,z);
      if(cd>-700||cd<-1100||plainW(x,z,cd)<.9||townW(x,z)>0||heightAt(x,z)<WATER+2)continue;
      const gx=contD(x+60,z)-contD(x-60,z),gz=contD(x,z+60)-contD(x,z-60);   // 海のほう(増える向き)
      warpTo(x,z,yawTo(-gx,-gz));dbgMsg.textContent='海岸平野へ移動（内陸を向いています）';return;
    }
  }
  dbgMsg.textContent='海岸平野: 見つかりません（半径40km以内）';
}
function dbgMountains(maxRing=6,want=3){                                          // 近い順の巨大な山（3つ以上見つかるまで外側へ広げる。最大±6区画）
  const cx=Math.floor(player.x/MC),cz=Math.floor(player.z/MC),out=[];
  for(let ring=0;ring<=maxRing;ring++){
    for(let a=-ring;a<=ring;a++)for(let b=-ring;b<=ring;b++){if(Math.max(Math.abs(a),Math.abs(b))!==ring)continue;const m=mtOfCell(cx+a,cz+b);if(m)out.push(m)}
    if(out.length>=want&&ring>=2)break;
  }
  return out.sort((p,q)=>Math.hypot(p.x-player.x,p.z-player.z)-Math.hypot(q.x-player.x,q.z-player.z));
}
function warpMountain(kind,name){
  const ms=dbgMountains();
  if(!ms.length){dbgMsg.textContent=name+': 近くに巨大な山がありません（±6区画）';return}
  const vis=dbgVisited.mt||(dbgVisited.mt=new Set()),key=m=>Math.round(m.x)+','+Math.round(m.z);
  let pick=ms.find(m=>!vis.has(key(m)));if(!pick){vis.clear();pick=ms[0]}
  vis.add(key(pick));
  const rv=mtRivers(pick),yaw=Math.random()*6.2832;
  if(kind==='top'){warpTo(pick.x,pick.z,yaw)}
  else{
    if(!rv.length){dbgMsg.textContent=name+': この山には川がありません';return}
    const R=rv[Math.floor(Math.random()*rv.length)],P=R.P;
    if(kind==='src'){const a=P[0],b=P[4];warpTo(a.x,a.z,yawTo(b.x-a.x,b.z-a.z))}                 // 源流から下流を向く
    else{const n=P.length,a=P[n-5],b=P[n-8];warpTo(a.x,a.z,yawTo(b.x-a.x,b.z-a.z))}               // 河口の近くから上流を向く
  }
  dbgMsg.textContent=`${name}へ移動（${vis.size}/${ms.length}つ目・山の高さ約${Math.round(pick.H)}m・川${rv.length}本）`;
}

  if(!list.length){dbgMsg.textContent='港町: この付近の帝国には、海に面した場所が見つからない';return}

function warpEmpire(){                                           // 帝国（まれ）。王都の東の外から王都を向く。押すたびに次の帝国へ
  const list=dbgFind(EMB*TCELL,empireOf,2,12);
  list.sort((p,q)=>Math.hypot(p.bx*EMB*TCELL-player.x,p.bz*EMB*TCELL-player.z)-Math.hypot(q.bx*EMB*TCELL-player.x,q.bz*EMB*TCELL-player.z));
  if(!list.length){dbgMsg.textContent='帝国: ±'+Math.round(12*EMB*TCELL/1000)+'km以内には無い';return}
  const vis=dbgVisited.emp||(dbgVisited.emp=new Set()),key=E=>E.bx+','+E.bz;
  let pick=list.find(E=>!vis.has(key(E)));if(!pick){vis.clear();pick=list[0]}
  vis.add(key(pick));
  // 王都が西洋風の場合、townOfCell() は意図的に null を返す。
  // その場合は empireOf() が保持している西洋都市の王都座標を使う。
  const ci=pick.bx*EMB+1,cz=pick.bz*EMB+1;
  let t=townOfCell(ci,cz),tx=null,tz=null,edge=0;
  if(t){tx=t.x;tz=t.z;edge=townEdge(t,0)}
  else{
    const cap=pick.euro&&pick.euro.find(o=>o.t==='c');
    if(cap){tx=cap.x;tz=cap.z;edge=190}
  }
  // 地形候補の都合で王都の生成に失敗した帝国でも、デバッグワープ自体は落とさない。
  if(tx===null||tz===null){
    const cap=pick.euro&&pick.euro[0];
    if(cap){tx=cap.x;tz=cap.z;edge=190}
    else{tx=(pick.bx*EMB+1.5)*TCELL;tz=(pick.bz*EMB+1.5)*TCELL;edge=0}
  }
  warpTo(tx+edge+90,tz,yawTo(-1,0));
  dbgMsg.textContent=`帝国へ移動（${vis.size}/${list.length}か所目）`;
}

    if(ph===1){MINI.phase=2;miniEuro(D)}
    else if(ph===2){
      if(!MINI.vl)MINI.vl=VLIST.filter(v=>Math.hypot(v.cx-D.gx,v.cz-D.gz)<MINI.R+170);
      const v=MINI.vl.shift();
      if(v)miniVillage(D,v);else{MINI.phase=3;MINI.el=null;miniCaravans(D)}
    }
    else if(ph===3){
      if(!MINI.el)MINI.el=miniEmpires(D);
      const E=MINI.el.shift();
      if(E)miniEmpire(D,E);else{MINI.wz=MINI.cz0;MINI.phase=4}
    }
    else if(ph===4)miniEmpWalls(D);
    else if(ph===5)miniLots(D);
    else miniWalls(D);
  }catch(err){
    console.error('minimap',err);
    if(ph===4){if(MINI.wz>MINI.cz1)MINI.phase=5}
    else if(ph===5){if(MINI.lrow>MINI.lz1)MINI.phase=6}
    else if(ph===6)miniFinish(D);
    else if(ph===1)MINI.phase=2;
  }
}
const MINI_HYP=[[0,[118,172,92]],[.2,[186,184,104]],[.45,[176,138,84]],[.7,[142,116,102]],[1,[246,246,250]]];   // 高さの色: 低い=緑 → 黄 → 茶 → 灰 → 雪
function miniHyp(t){
  for(let i=1;i<MINI_HYP.length;i++){const[b,cb]=MINI_HYP[i],[a,ca]=MINI_HYP[i-1];if(t<=b){const u=Math.max(0,(t-a)/(b-a));return[ca[0]+(cb[0]-ca[0])*u,ca[1]+(cb[1]-ca[1])*u,ca[2]+(cb[2]-ca[2])*u]}}
  return MINI_HYP[MINI_HYP.length-1][1];
}
function miniContours(D){                                       // 等高線: 10mごと（50mごとは太線）。高さの格子から地図1枚につき1回だけ描いて使い回す
  const N=MINI.N,n=N+1,S=MINI.BIG,k=S/N,H=D.H,cv=document.createElement('canvas');cv.width=cv.height=S;
  const c=cv.getContext('2d'),I=10;
  for(const major of[false,true]){
    c.beginPath();
    for(let j=0;j<N;j++)for(let i=0;i<N;i++){
      const h=[H[j*n+i],H[j*n+i+1],H[(j+1)*n+i+1],H[(j+1)*n+i]],xs=[i+.5,i+1.5,i+1.5,i+.5],ys=[j+.5,j+.5,j+1.5,j+1.5];   // 左上・右上・右下・左下
      const mn=Math.min(h[0],h[1],h[2],h[3]),mx=Math.max(h[0],h[1],h[2],h[3]);
      for(let L=Math.floor(Math.max(mn,WATER+.4)/I)+1;L*I<=mx;L++){
        if((L%5===0)!==major)continue;
        const v=L*I,pt=[];
        for(let e=0;e<4;e++){const q=(e+1)%4;if((h[e]<v)!==(h[q]<v)){const t=(v-h[e])/(h[q]-h[e]);pt.push([(xs[e]+(xs[q]-xs[e])*t)*k,(ys[e]+(ys[q]-ys[e])*t)*k])}}
        for(let m=0;m+1<pt.length;m+=2){c.moveTo(pt[m][0],pt[m][1]);c.lineTo(pt[m+1][0],pt[m+1][1])}
      }
    }
    c.lineWidth=major?2.2:1;c.strokeStyle=major?'rgba(70,40,20,.75)':'rgba(70,40,20,.35)';c.stroke();
  }
  return cv;
}
function miniDrawBig(){                                          // 拡大表示: 見ている場所(vx,vz)を中心に2R(=600m)四方を表示。回転しない（上が−Z）
  const c=MINI.ctx,S=MINI.BIG,R=MINI.R,D=MINI.disp,k=S/(R*2),vx=MINI.vx,vz=MINI.vz;
  c.setTransform(1,0,0,1,0,0);c.fillStyle='#1d2f40';c.fillRect(0,0,S,S);
  if(D){
    const ox=(D.gx-vx)*k,oz=(D.gz-vz)*k;                         // 作ってある地図の左上（画面内の位置）
    c.imageSmoothingEnabled=true;
    c.drawImage(D.off,ox,oz,S,S);
    if(D.H){if(!D.cont)D.cont=miniContours(D);c.drawImage(D.cont,ox,oz,S,S)}
    c.drawImage(D.ov,ox,oz,S,S);
    c.lineWidth=2;c.strokeStyle='rgba(255,255,255,.3)';c.strokeRect(ox,oz,S,S);   // 作ってある範囲の枠
  }
  c.save();c.translate((player.x-vx+R)*k,(player.z-vz+R)*k);c.rotate(-player.yaw);   // 自分（向き付き）
  c.beginPath();c.moveTo(0,-22);c.lineTo(15,16);c.lineTo(0,8);c.lineTo(-15,16);c.closePath();
  c.fillStyle='#fff';c.fill();c.lineWidth=4;c.strokeStyle='#d02020';c.stroke();c.restore();
  c.lineWidth=2;c.strokeStyle='rgba(255,255,255,.55)';c.beginPath();c.moveTo(S/2-14,S/2);c.lineTo(S/2+14,S/2);c.moveTo(S/2,S/2-14);c.lineTo(S/2,S/2+14);c.stroke();   // 画面の中心
  const hk=Math.round(vx)+','+Math.round(vz);if(hk!==MINI.hk){MINI.hk=hk;MINI.hv=heightAt(vx,vz)}   // 中心の高さ（動かした時だけ計算）
  const t=`seed:${SEED}　中心(${Math.round(vx)}, ${Math.round(vz)}) 高さ${Math.round(MINI.hv)}m　等高線10m(太線50m)　緑=居住可能地(平坦・疎林・水辺)　自分(${Math.round(player.x)}, ${Math.round(player.z)})　${R*2}m四方・上が−Z　${MINI.build?'生成中…':'生成完了'}　ドラッグで移動・タップで閉じる`;
  if(t!==MINI.capT){MINI.capT=t;MINI.cap.textContent=t}
}
function miniDraw(){
  if(MINI.big){miniDrawBig();return}
  const c=MINI.ctx,S=MINI.SZ,k=S/2/MINI.SHOW,D=MINI.disp;
  c.setTransform(1,0,0,1,0,0);c.fillStyle='#2b4a66';c.fillRect(0,0,S,S);
  if(D){
    const cs=Math.cos(player.yaw),sn=Math.sin(player.yaw);
    c.setTransform(k*cs,k*sn,-k*sn,k*cs,S/2,S/2);               // 進行方向が上
    c.imageSmoothingEnabled=true;
    const ox=D.gx-player.x-MINI.R,oz=D.gz-player.z-MINI.R;
    c.drawImage(D.off,ox,oz,MINI.R*2,MINI.R*2);
    c.drawImage(D.ov,ox,oz,MINI.R*2,MINI.R*2);
  }
  c.setTransform(1,0,0,1,0,0);                                  // 自分（真ん中の三角）
  c.beginPath();c.moveTo(S/2,S/2-16);c.lineTo(S/2+11,S/2+12);c.lineTo(S/2,S/2+6);c.lineTo(S/2-11,S/2+12);c.closePath();
  c.fillStyle='#fff';c.fill();c.lineWidth=3;c.strokeStyle='#d02020';c.stroke();
}
function miniUpdate(){
  if(MINI.dead)return;
  try{
    if(MINI.build&&MINI.bseed!==SEED)MINI.build=false;                                  // 新しいマップになったら作り直し
    let D=MINI.disp,far=0;
    if(D&&D.seed!==SEED){MINI.disp=D=null}
    if(D){far=Math.hypot(MINI.cx()-D.gx,MINI.cz()-D.gz);if(far>MINI.R*.85&&!MINI.big){MINI.disp=D=null}}   // 拡大中は古い地図を残したまま、見ている場所の地図を作り直す   // ワープしたら古い地図は捨てる
    if(!MINI.build&&(!D||far>(MINI.big?40:MINI.TRIG)))miniStart();
    if(MINI.build)miniStep();
    miniDraw();
  }catch(err){MINI.dead=true;console.error('minimap',err);const m=document.getElementById('mini');if(m)m.style.display='none'}   // 地図の不具合でゲームを止めない
}
// ---------- ループ ----------
const info=document.getElementById('info');
document.getElementById('regen').onclick=()=>{SEED=Math.floor(Math.random()*1e9);resetWorld()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();fitRes()});
resetWorld();
let last=performance.now(),frame=0;
function euMeshes(){const a=[];for(const g of euroGroups.values())g.traverse(o=>{if(o.userData&&o.userData.dk)a.push(o)});return a}
function safeRender(){
  try{renderer.render(scene,camera);return}catch(err){EU_ERR='描画エラー: '+(err&&err.message)}
  const ms=euMeshes();if(!ms.length){info.textContent=EU_ERR;return}
  const vis=ms.map(m=>m.visible);ms.forEach(m=>m.visible=false);
  try{renderer.render(scene,camera)}catch(err){EU_ERR='描画エラー（装飾以外）: '+(err&&err.message);ms.forEach((m,i)=>m.visible=vis[i]);info.textContent=EU_ERR;return}
  const bad=new Set();
  for(const m of ms){m.visible=true;try{renderer.render(scene,camera)}catch(err){bad.add(m.userData.dk);m.visible=false;EU_ERR='描画エラー: '+m.userData.dk+' '+(err&&err.message)}}
  bad.forEach(k=>EU_BAD.add(k));
  for(const m of ms)if(EU_BAD.has(m.userData.dk))m.visible=false;
  info.textContent=EU_ERR;
}
window.addEventListener('error',ev=>{EU_ERR='エラー: '+ev.message+(ev.lineno?' (行'+ev.lineno+')':'');if(typeof info!=='undefined')info.textContent=EU_ERR});
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  let fx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x,fz=(keys.KeyS?1:0)-(keys.KeyW?1:0)+joy.y;
  if(MINI.big){fx=0;fz=0}
  const l=Math.hypot(fx,fz);if(l>1){fx/=l;fz/=l}
  const speed=(keys.ShiftLeft?14:7)*dt,s=Math.sin(player.yaw),c=Math.cos(player.yaw);
  const mx=(fx*c+fz*s)*speed,mz=(-fx*s+fz*c)*speed,ns=Math.max(1,Math.ceil(Math.hypot(mx,mz)/.1));   // 1回に0.1mより大きく動かさない（階段・壁のすり抜け防止）
  for(let i=0;i<ns;i++){player.x+=mx/ns;player.z+=mz/ns;collide()}
  player.y+=(player.gy+1.7-player.y)*Math.min(1,dt*12);
  camera.position.set(player.x,player.y,player.z);
  camera.rotation.set(player.pitch,player.yaw,0);
  water.position.x=player.x;water.position.z=player.z;
  updateEnv(dt);
  if(frame++%10===0){updateChunks();info.textContent=`seed:${SEED}  chunks:${chunks.size}  ${biomeName()}${EU_ERR?'  '+EU_ERR:''}`;updateNav()}
  const tx=Math.round(player.x/.0586)*.0586,tz=Math.round(player.z/.0586)*.0586;   // 影のちらつき防止（テクセルにスナップ）
  sun.target.position.set(tx,0,tz);sun.position.set(tx+SUN_OFF.x,SUN_OFF.y,tz+SUN_OFF.z);
  miniUpdate();
  if(!MINI.big)safeRender();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
