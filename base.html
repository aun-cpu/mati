<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>プロシージャルマップ（地形のみ）</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9cc7e8;touch-action:none;font-family:sans-serif}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:-moz-crisp-edges}
  #ui{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;color:#fff;font-size:12px;text-shadow:0 1px 3px #000}
  button{margin-top:6px;padding:8px 12px;border:0;border-radius:8px;background:rgba(0,0,0,.5);color:#fff;font-size:13px}
  #uiTgl{margin:0 0 4px;padding:4px 10px;font-size:11px;background:rgba(0,0,0,.4)}
  #ui.hide>*:not(#uiTgl){display:none}
  #ui.hide #uiTgl{opacity:.45}
  #stick{position:fixed;left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.15);display:none}
  #dbg{display:none;max-width:min(78vw,calc(100vw - 148px));margin-top:4px;padding:6px 8px 8px;border-radius:8px;background:rgba(0,0,0,.55)}
  #dbg .h{margin-top:6px;font-size:11px;opacity:.8}
  #dbg button{margin:3px 3px 0 0;padding:6px 8px;font-size:12px;background:rgba(255,255,255,.22)}
  #dbg #dbgmsg{margin-top:6px;font-size:11px;min-height:1em}
  #dbgR{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px + 124px + 8px);right:8px;display:flex;flex-direction:column;align-items:flex-end;z-index:9}   /* ミニマップ(120px+枠)の下 */
  #dbgR #dbgItemBtn{margin-top:0}
  #dbgR #dbgCreBtn{margin-top:4px}
  #dbgItems{display:none;box-sizing:border-box;width:min(46vw,200px);max-height:calc(100vh - 230px);overflow:auto;margin-top:4px;padding:6px 8px 8px;border-radius:8px;background:rgba(0,0,0,.55)}
  #dbgItems .h{margin-top:0;font-size:11px;opacity:.8}
  #dbgItems button{margin:3px 3px 0 0;padding:6px 8px;font-size:12px;background:rgba(255,255,255,.22)}
  #dbgItems #dbgItemMsg{margin-top:6px;font-size:11px;min-height:1em}
  #dbgCre{display:none;box-sizing:border-box;width:min(46vw,200px);max-height:calc(100vh - 230px);overflow:auto;margin-top:4px;padding:6px 8px 8px;border-radius:8px;background:rgba(0,0,0,.55)}
  #dbgCre .h{margin-top:0;font-size:11px;opacity:.8}
  #dbgCre button{margin:3px 3px 0 0;padding:6px 8px;font-size:12px;background:rgba(255,255,255,.22)}
  #dbgCre #dbgCreMsg{margin-top:6px;font-size:11px;min-height:1em}
  #toast{position:fixed;left:50%;top:28%;transform:translateX(-50%);padding:10px 22px;border-radius:8px;background:rgba(40,10,10,.72);color:#f3e2b0;border:1px solid #d9b24a;font-size:22px;letter-spacing:.08em;opacity:0;transition:opacity .6s;pointer-events:none;z-index:20;white-space:nowrap}
  #mini{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;width:120px;height:120px;border-radius:50%;overflow:hidden;background:#3a78b8;border:2px solid rgba(255,255,255,.85);box-shadow:0 1px 6px rgba(0,0,0,.6);pointer-events:auto;cursor:pointer;z-index:10}
  #mini canvas{width:100%;height:100%;image-rendering:auto}
  #mapcap{display:none}
  #mini.big{top:0;left:0;right:0;bottom:0;width:auto;height:auto;border:0;border-radius:0;box-shadow:none;background:#16222e;z-index:30;display:flex;align-items:center;justify-content:center}
  #mini.big canvas{width:min(100vw,100vh);height:min(100vw,100vh);width:min(100vw,100dvh);height:min(100vw,100dvh)}
  #mini.big #mapcap{display:block;position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);color:#fff;font-size:12px;text-align:center;text-shadow:0 1px 3px #000;pointer-events:none}
  #mapbtns{display:none}
  #mini.big{touch-action:none;cursor:grab}
  #mini.big #mapbtns{display:block;position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;z-index:2}
  body.mapview #ui,body.mapview #stick,body.mapview #toast{display:none}
  .act{position:fixed;right:calc(env(safe-area-inset-right,0px) + 24px);margin:0;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.15);color:#fff;font-size:13px;font-weight:bold;line-height:1.15;text-align:center;text-shadow:0 1px 3px #000;z-index:12;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
  .act small{display:block;font-size:10px;font-weight:normal;opacity:.85}
  .act.on{background:rgba(255,255,255,.5);color:#000;text-shadow:none;border-color:#fff}
  #dashBtn.lock{background:rgba(255,200,60,.8);color:#000;text-shadow:none;border-color:#fff}
  #jumpBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 28px + 70px + 16px);width:84px;height:84px}
  #dashBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:70px;height:70px;right:calc(env(safe-area-inset-right,0px) + 31px)}
  body.mapview .act{display:none}
  #knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.5)}
  #inv{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:4px;padding:4px;border-radius:10px;background:rgba(0,0,0,.4);z-index:11;user-select:none;-webkit-user-select:none}
  #inv .slot{position:relative;margin:0;padding:0;width:48px;height:48px;border-radius:6px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-size:11px;touch-action:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
  #inv .slot.sel{border-color:#ffd24a;background:rgba(255,210,74,.28);box-shadow:0 0 0 1px #000 inset}
  #inv .slot.carry{border:2px dashed #ffd24a;opacity:.55}   /* 長押しで持ち上げ中のマス */
  #inv .slot.over{border-color:#8fd3ff;background:rgba(143,211,255,.3)}   /* 持ち上げ中、指の下にあるマス */
  #inv .slot .n{position:absolute;left:3px;top:1px;font-size:10px;opacity:.75;text-shadow:0 1px 2px #000}
  #inv .slot .it{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:11px;font-weight:bold;text-shadow:0 1px 2px #000;pointer-events:none}
  @media (max-width:640px){#inv{bottom:calc(env(safe-area-inset-bottom,0px) + 206px)}#inv .slot{width:40px;height:40px}}   /* 縦持ちのスマホ: スティック・ジャンプ/ダッシュボタンと重ならないよう上に */
  #inv .slot .ic{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;pointer-events:none;display:none;image-rendering:auto}
  #inv .slot .cnt{position:absolute;right:3px;bottom:1px;font-size:12px;font-weight:bold;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;pointer-events:none}
  #inv .slot .it.em{bottom:auto;top:50%;transform:translateY(-50%);font-size:26px;text-shadow:none}
  @media (max-width:640px){#inv .slot .it.em{font-size:22px}}
  body.mapview #inv{display:none}
  #bars{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px + 56px + 6px);width:316px;display:flex;gap:6px;z-index:11;pointer-events:none;user-select:none;-webkit-user-select:none}   /* 体力バー・空腹バー: インベントリのすぐ上 */
  #bars .bar{position:relative;flex:1;height:8px;border-radius:4px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);overflow:hidden}
  #bars .bar i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:3px}
  #bars .sta i{left:0;width:calc(100%*var(--p,1));background:linear-gradient(#ff7b7b,#d9342b)}   /* 体力バーは赤 */
  #bars .hun i{background:linear-gradient(#ffc468,#e8892a)}
  #bars .bar.low i{background:linear-gradient(#ff8a80,#d63a2f)}
  #bars .sta.low i{background:linear-gradient(#c24545,#7d1414)}
  #bars .bar.exh{animation:barBlink .5s infinite alternate}
  @keyframes barBlink{to{opacity:.55}}
  #bars .bar span{position:absolute;left:7px;top:0;line-height:12px;font-size:10px;font-weight:bold;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000}
  @media (max-width:640px){#bars{bottom:calc(env(safe-area-inset-bottom,0px) + 206px + 48px + 6px);width:268px}}
  body.mapview #bars{display:none}
  #inv .eqbtn{position:absolute;left:100%;top:4px;margin-left:6px;display:flex;align-items:center;justify-content:center}   /* インベントリ右横の装備ボタン（人マーク） */
  #inv .eqbtn svg{width:70%;height:70%;pointer-events:none}
  #eq{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px + 56px + 6px + 8px + 6px);width:190px;height:216px;border-radius:10px;background:rgba(0,0,0,.4);z-index:11;display:none;user-select:none;-webkit-user-select:none}   /* 装備のインベントリ: インベントリ・バーの上 */
  #eq.open{display:block}
  #inv .craftbtn{position:absolute;left:100%;top:4px;margin-left:60px;display:flex;align-items:center;justify-content:center}   /* 装備ボタン(人マーク)のさらに右横の作成ボタン */
  #inv .craftbtn svg{width:70%;height:70%;pointer-events:none}
  @media (max-width:640px){#inv .craftbtn{margin-left:52px}}
  @media (max-width:520px){#inv .craftbtn{margin-left:6px;top:-40px}}   /* 狭い画面: 横に置くと画面の外に出るので、人マークの上に置く */
  #cr{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px + 56px + 6px + 8px + 6px);width:300px;max-width:calc(100vw - 16px);max-height:min(240px,38vh);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;border-radius:10px;background:rgba(0,0,0,.5);color:#fff;z-index:11;display:none;user-select:none;-webkit-user-select:none}   /* 作成のレシピ: インベントリ・バーの上 */
  #cr.open{display:block}
  @media (max-width:640px){#cr{bottom:calc(env(safe-area-inset-bottom,0px) + 206px + 48px + 6px + 8px + 6px)}}
  body.mapview #cr{display:none}
  #cr .row{display:flex;align-items:stretch;border-bottom:1px solid rgba(255,255,255,.18);-webkit-tap-highlight-color:transparent}
  #cr .row:last-child{border-bottom:0}
  #cr .row.no{opacity:.4}
  #cr .row.ok{background:rgba(255,210,74,.12);cursor:pointer}
  #cr .out{flex:0 0 46%;display:flex;align-items:center;gap:6px;padding:5px 6px;border-right:1px solid rgba(255,255,255,.35);font-size:12px;font-weight:bold;box-sizing:border-box}   /* 左: 作れる物 */
  #cr .need{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:5px 8px;font-size:13px}   /* 右: 必要な材料 ×個数 */
  #cr .ing{display:flex;align-items:center;gap:3px;white-space:nowrap}
  #cr .ing.lack{color:#ff8a80}
  #cr img{width:30px;height:30px;object-fit:contain;flex:0 0 auto}
  #cr .ing img{width:24px;height:24px}
  #cr .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #cr .txt{display:inline-block;min-width:24px;text-align:center;font-size:11px}
  #eq svg.fig{position:absolute;left:63%;top:50%;width:70px;height:178px;transform:translate(-50%,-50%);opacity:.45;pointer-events:none}
  #eq .eslot{position:absolute;width:44px;height:44px;border-radius:6px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;overflow:hidden}
  #eq .eslot[data-k=head]{left:10px;top:10px}   /* 4つのマスは左に縦1列: 頭・胴体・脚・足の順 */
  #eq .eslot[data-k=torso]{left:10px;top:60px}
  #eq .eslot[data-k=legs]{left:10px;top:110px}
  #eq .eslot[data-k=feet]{left:10px;top:160px}
  #eq .eslot .lb{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:12px;opacity:.55;text-shadow:0 1px 2px #000}
  #eq .eslot .ic{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;display:none}
  #eq .eslot .it{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:11px;font-weight:bold;text-shadow:0 1px 2px #000}
  @media (max-width:640px){#eq{bottom:calc(env(safe-area-inset-bottom,0px) + 206px + 48px + 6px + 8px + 6px)}}
  body.mapview #eq{display:none}
  #mgTree{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,380px);box-sizing:border-box;display:none;padding:10px 8px 6px;border-radius:12px;background:rgba(0,0,0,.88);border:1px solid rgba(255,255,255,.3);color:#fff;z-index:13;user-select:none;-webkit-user-select:none;touch-action:manipulation}   /* 魔法のスキルツリー: 画面の真ん中 */
  #mgTree.open{display:block}
  #mgTree svg{width:100%;height:auto;display:block}
  #mgTree text{pointer-events:none}
  #mgTree .cap{text-align:center;font-size:13px;min-height:18px;margin-top:2px}
  #mgTree .x{position:absolute;right:6px;top:4px;width:30px;height:30px;margin:0;padding:0;border:0;border-radius:6px;background:rgba(255,255,255,.12);color:#fff;font-size:18px;line-height:30px;text-align:center;cursor:pointer}
  body.mapview #mgTree{display:none}
  #tgt{position:fixed;left:50%;top:calc(50% + 30px);transform:translateX(-50%);display:none;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.45);color:#fff;font-size:12px;white-space:nowrap;pointer-events:none;z-index:9;text-shadow:0 1px 2px #000}   /* 狙っている生き物の物理度・魔力 */
  body.mapview #tgt{display:none!important}
  /* 魔法ボタン（装備パネルの右上）と魔法の選択リスト */
  #eq .mgbtn{position:absolute;right:8px;top:8px;width:40px;height:40px;margin:0;padding:0;border-radius:6px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #eq .mgbtn svg{width:72%;height:72%;pointer-events:none}
  #eq .mgbtn.sel{border-color:#ffd24a;background:rgba(255,210,74,.28)}
</style>
</head>
<body>
<div id="ui"><button id="uiTgl">文字を消す</button><div id="info"></div><div id="nav" style="font-size:13px"></div><button id="regen">新しいマップ</button> <button id="dbgBtn">デバッグ</button><div id="dbg"></div><div id="dbgR"><button id="dbgItemBtn">アイテム</button><div id="dbgItems"></div><button id="dbgCreBtn">生き物</button><div id="dbgCre"></div></div><div>PC: クリックで操作 / WASD+Shift　スマホ: 左=移動 右=視点＋ジャンプ/ダッシュボタン（ダッシュ長押しで固定）　PC: Space=ジャンプ</div></div>

<div id="stick"><div id="knob"></div></div>
<button class="act" id="dashBtn">ダッシュ<small>長押しで固定</small></button>
<button class="act" id="jumpBtn">ジャンプ</button>

<div id="eq">
  <svg class="fig" viewBox="105 60 305 780" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"><path d="M222 80Q315 78 317 128Q318 185 255 192Q205 195 196 150Q196 110 213 85M246 185V240M284 180V232M222 238L205 242Q175 280 150 350Q120 430 122 480Q125 520 150 545Q175 548 188 540Q190 520 190 497M325 230Q380 290 390 400Q395 480 388 540Q370 535 360 520Q355 500 365 485M222 532V785M333 535V790M215 748L148 790Q145 805 205 810M333 790L305 790Q290 810 295 825L335 826"/></svg>
  <div class="eslot" data-k="head"><span class="lb">頭</span><img class="ic" alt=""><span class="it"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<script>
// ※ 地形（海・大陸・山・川・湖・バイオーム・盆地・台地・氷河・海岸平野）の生成とプレビューだけを残した版。
//   街・村・港町・屋敷・教会・城・帝国・キャラバンサライ・畑などの生成は、街生成アルゴリズムを別に作るため取り除いてある。
//   街は地形（heightAt / climateAt / riverEff / contD など）を読むだけで作れる。地形は街の影響を受けない（街の平坦化なし）。
let EU_ERR='';
const WATER=-6;                                                    // 海面の高さ
// ---------- 乱数・ノイズ ----------
let SEED = Math.floor(Math.random()*1e9);
function hash(x,y,s){let h=(x*374761393+y*668265263+s*2147483647)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)/4294967295}
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,SEED),b=hash(xi+1,yi,SEED),c=hash(xi,yi+1,SEED),d=hash(xi+1,yi+1,SEED);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y){let s=0,a=.5,f=1;for(let i=0;i<5;i++){s+=a*vnoise(x*f,y*f);f*=2;a*=.5}return s}

// ---------- 気候帯とバイオーム ----------
// 気温tと湿度mの低周波ノイズ2枚で4つの気候帯（熱帯・乾燥帯・温帯・冷帯）を決め、中周波ノイズvで帯の中の植生（草原/森/ジャングルなど）を分ける。境目はなめらかに混ざる。
//  乾燥帯: 奥=砂漠、他の帯との境目=サバンナ / 温帯: 乾燥帯側=ステップ、草原、広葉樹林 / 熱帯: 草原・森・ジャングル / 冷帯: 奥=雪原、縁=針葉樹林と草原（雪はまだらに積もる）
const CLIM_F=.0003;                                              // 気候帯の細かさ（小さいほど広い。約3km周期で、植生の切り替わりはおよそ1kmに1回）
const sm01=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
// ---------- 大陸（海のなかに浮かぶ陸地） ----------
// 32.4km四方の区画ごとに大陸が1つ（区画の外は海）。大陸の中心近くに帝国(王都=区画の中心)、反対側に砂漠、横に山脈（山頂から川が海へ）。
const CONT=32400,CONT_O=10800,contCache=new Map();let _ctI=NaN,_ctJ=NaN,_ctK=null;
function contOfCell(i,j){
  const key=i+','+j;if(contCache.has(key))return contCache.get(key);
  const r=mulberry(hash(i,j,SEED+4242)*1e9|0),ex=i*CONT+5400,ez=j*CONT+5400,th=r()*6.2832,rx=8000+r()*2000,ry=rx*(.55+.25*r());
  const ax=Math.cos(th),az=Math.sin(th),side=r()<.5?-1:1,k={i,j,ex,ez,th,rx,ry,ax,az,ph:[r()*6.28,r()*6.28,r()*6.28],ox:r()*100,oz:r()*100};
  k.x=ex+ax*.28*rx;k.z=ez+az*.28*rx;                                  // 大陸の中心（王都は中心から少し端寄り）
  const P=(u,v)=>[k.x+ax*u*rx-az*v*ry,k.z+az*u*rx+ax*v*ry];
  const D=P(.55,-side*.15);k.dx=D[0];k.dz=D[1];k.dr=1800+r()*1200;      // 砂漠の中心と半径

    const f=g.toNonIndexed();f.computeVertexNormals();
    const p=f.attributes.position.array,n=f.attributes.normal.array;
    for(let i=0;i<p.length;i++){pos.push(p[i]);nor.push(n[i])}

  m.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));m.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));m.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  return m;
}

  for(let dx=-RADIUS;dx<=RADIUS;dx++)for(let dz=-RADIUS;dz<=RADIUS;dz++){
    if(dx*dx+dz*dz>RADIUS*RADIUS+1)continue;

// ---------- 当たり判定と地面の高さ ----------
// 木・岩=円（押し出し方式なので滑る）。地面は heightAt（海の上は海面の少し下で止まる）。
const STEP=.55,PR=.45;
function collide(){
  const cx=Math.floor(player.x/CHUNK),cz=Math.floor(player.z/CHUNK),circs=[];
  for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){
    const c=chunks.get((cx+dx)+','+(cz+dz));if(c)for(const q of c.userData.circ)circs.push(q);
  }
  const ground=()=>{player.gy=Math.max(heightAt(player.x,player.z),WATER-.5)};
  ground();
  for(let it=0;it<3;it++){
    for(const[qx,qz,qr] of circs){
      const dx=player.x-qx,dz=player.z-qz,d=Math.hypot(dx,dz),m=qr+PR;
      if(d<m){if(d>1e-4){player.x+=dx/d*(m-d);player.z+=dz/d*(m-d)}else player.x+=m}
    }
  }
  ground();
}

// 壁と落下: 地面が急すぎる（傾き SLOPE_MAX 以上＝約52°）所へは歩いて進めない（壁沿いには滑る）。空中では、足が段の上まで上がっていないと越えられない（高い壁は跳んでも登れない・低い段はジャンプで登れる）。
// 足場がなくなる（崖から歩き出す）と空中状態になって落下し、着地の勢いが強いと視点が沈む。
const SLOPE_MAX=1.3,FALL_GAP=1.2,VMIN=-40;
function tryMove(dx,dz){
  if(!dx&&!dz)return true;
  const ox=player.x,oz=player.z,og=player.gy;
  player.x+=dx;player.z+=dz;collide();
  const ok=player.air?player.gy<=player.y-1.7+.15:player.gy-og<=Math.hypot(dx,dz)*SLOPE_MAX+.02;
  if(!ok){player.x=ox;player.z=oz;player.gy=og}
  return ok;
}

    slots,get sel(){return sel},
    select(i){sel=(i%N+N)%N;draw()},
    set(i,item){slots[i]=item||null;draw()},                       // 例: INV.set(0,{name:'斧',color:'#ffd24a'})
    add(item,n){                                                    // 同じidのスタックに足し、いっぱい(MAX)なら空きマスへ。入った個数を返す（0=満杯で入らない）
      const MAX=64;let left=n;
      for(let i=0;i<N&&left>0;i++){const it=slots[i];if(it&&it.id===item.id&&it.count>0&&it.count<MAX){const k=Math.min(left,MAX-it.count);it.count+=k;left-=k}}
      for(let i=0;i<N&&left>0;i++){if(!slots[i]){const k=Math.min(left,MAX);slots[i]=Object.assign({},item,{count:k});left-=k}}
      if(left<n)draw();return n-left;
    },
    useOne(){const it=slots[sel];if(!it)return false;if(it.count>1)it.count--;else slots[sel]=null;draw();return true},   // 選んでいるマスの物を1個消費する（0個になったらマスが空く）
    take(i){const it=slots[i];if(!it)return null;slots[i]=null;draw();return it},   // そのマスの中身を（スタックごと）取り出す。空なら null
    move(a,b){                                                      // aのマスをbへ移す（bが空なら移動・埋まっていれば交換・同じ物のスタックどうしは64まで合体）
      if(a===b||!slots[a])return;const A=slots[a],B=slots[b];
      if(B&&A.id===B.id&&A.count>0&&B.count>0){const k=Math.min(A.count,64-B.count);B.count+=k;A.count-=k;if(A.count<=0)slots[a]=null}
      else{slots[a]=B;slots[b]=A}
      draw();
    },
    countOf(id){let c=0;for(const it of slots)if(it&&it.id===id)c+=it.count>0?it.count:1;return c},   // そのidの持っている個数（全マスの合計）
    removeId(id,n){let left=n;for(let i=0;i<N&&left>0;i++){const it=slots[i];if(!it||it.id!==id)continue;const have=it.count>0?it.count:1,k=Math.min(left,have);left-=k;if(have-k<=0)slots[i]=null;else it.count=have-k}draw();return n-left},   // そのidをn個消費する（消費できた個数を返す）
    noSwingUntil:0,                                                 // この時刻までは画面タップで斧を振らない（ドロップ操作のタップが振りにならないように）
    get current(){return slots[sel]}
  };
  addEventListener('pointerdown',e=>{                               // 持ち上げ待ちの時にインベントリの外を押したら、前へドロップ
    if(carry<0||dragging)return;
    if(e.target.closest&&e.target.closest('#inv'))return;
    const it=api.take(carry);endCarry();if(it)dropItemForward(it);
    api.noSwingUntil=performance.now()+400;
  },true);
  addEventListener('keydown',e=>{const m=/^Digit([1-6])$/.exec(e.code);if(m)api.select(+m[1]-1)});
  addEventListener('wheel',e=>{if(MINI&&MINI.big)return;api.select(sel+(e.deltaY>0?1:-1))},{passive:true});
  box.addEventListener('touchstart',e=>e.stopPropagation(),{passive:false});   // マスの隙間に触れても、移動・視点の操作として扱わない
  draw();return api;
})();

const MAGIC=(()=>{
  const list=[],btn=document.getElementById('mgBtn'),box=document.getElementById('mgTree'),svgBox=document.getElementById('mgSvg'),cap=document.getElementById('mgCap'),X=document.getElementById('mgX');let sel=null;
  const NODES=[   // x,y=位置 / r=半径 / from=線でつながる元のノード。左の5つ(上から 火・雷・氷・水・闇)が基本、右へ行くほど合成した魔法
    {id:'fire',x:28,y:26},{id:'thunder',x:28,y:82},{id:'ice',x:28,y:146},{id:'water',x:28,y:202},{id:'dark',x:28,y:258},
    {id:'a',x:118,y:54,from:['fire','thunder']},{id:'b',x:118,y:174,from:['ice','water']},{id:'c',x:118,y:258,from:['dark']},
    {id:'d',x:228,y:106,from:['a','c']},{id:'e',x:228,y:216,from:['b','c']},
    {id:'z',x:322,y:160,r:26,from:['d','e']}];
  const by={};NODES.forEach(n=>by[n.id]=n);
  function draw(){
    let h='<svg viewBox="0 0 360 284">';
    NODES.forEach(n=>(n.from||[]).forEach(f=>{const a=by[f];h+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+n.x+'" y2="'+n.y+'" stroke="rgba(255,255,255,.5)" stroke-width="2.5" stroke-linecap="round"/>'}));   // 線を先に描いて、丸で隠す
    NODES.forEach(n=>{
      const r=n.r||17,m=list.find(q=>q.id===n.id),on=!!(m&&sel&&sel.id===m.id);
      h+='<g data-id="'+n.id+'"><circle cx="'+n.x+'" cy="'+n.y+'" r="'+r+'" fill="#0c0c10"/>'
        +'<circle cx="'+n.x+'" cy="'+n.y+'" r="'+r+'" fill="'+(on?'rgba(255,210,74,.3)':m?'rgba(255,255,255,.14)':'none')+'" stroke="'+(on?'#ffd24a':m?'#fff':'rgba(255,255,255,.55)')+'" stroke-width="'+(on?3.5:2.5)+'"/>'
        +(m?(m.icon?'<image href="'+m.icon+'" x="'+(n.x-r*.62)+'" y="'+(n.y-r*.62)+'" width="'+(r*1.24)+'" height="'+(r*1.24)+'" pointer-events="none"/>':'<text x="'+n.x+'" y="'+n.y+'" text-anchor="middle" dominant-baseline="central" font-size="'+Math.round(r*1.15)+'">'+m.emoji+'</text>')+'<circle cx="'+n.x+'" cy="'+n.y+'" r="'+(r+5)+'" fill="transparent" style="cursor:pointer"/>':'')+'</g>';   // 魔法がある丸だけ押せる
    });
    svgBox.innerHTML=h+'</svg>';cap.textContent=sel?'選択中：'+sel.name:'';
    btn.title='魔法'+(sel?'：'+sel.name:'');
  }
  svgBox.addEventListener('pointerdown',e=>{
    const g=e.target.closest&&e.target.closest('g[data-id]');if(!g)return;
    const m=list.find(q=>q.id===g.getAttribute('data-id'));if(!m)return;   // 魔法のない◯は押しても何も起きない
    e.preventDefault();sel=m;draw();api.closeList();
  });
  ['pointerdown','touchstart','mousedown','click'].forEach(t=>box.addEventListener(t,e=>e.stopPropagation(),{passive:false}));   // ツリーに触れても視点・移動・殴りにしない
  X.addEventListener('pointerdown',e=>{e.preventDefault();api.closeList()});
  btn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();api.toggleList()});
  btn.addEventListener('contextmenu',e=>e.preventDefault());
  const api={add(m){list.push(m);if(!sel)sel=m;draw()},get current(){return sel},
    cast(){if(sel&&sel.cast)sel.cast()},
    toggleList(){const on=box.classList.toggle('open');btn.classList.toggle('sel',on)},
    closeList(){box.classList.remove('open');btn.classList.remove('sel')}};
  draw();return api;
})();

// ---------- 装備（頭・胴体・脚・足）: インベントリ右横の人マークのボタンで開閉（PCはEキー）。装備できるアイテムはまだ無いので枠だけ。EQUIP.set('head',{name:'帽子'}) のように入れる ----------
const EQUIP=(()=>{
  const box=document.getElementById('eq'),KEYS=['head','torso','legs','feet'],items={},els={};
  KEYS.forEach(k=>els[k]=box.querySelector('[data-k='+k+']'));
  const btn=document.createElement('button');btn.className='slot eqbtn';btn.title='装備';
  btn.innerHTML='<svg viewBox="105 60 305 780" fill="none" stroke="#fff" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"><path d="M222 80Q315 78 317 128Q318 185 255 192Q205 195 196 150Q196 110 213 85M246 185V240M284 180V232M222 238L205 242Q175 280 150 350Q120 430 122 480Q125 520 150 545Q175 548 188 540Q190 520 190 497M325 230Q380 290 390 400Q395 480 388 540Q370 535 360 520Q355 500 365 485M222 532V785M333 535V790M215 748L148 790Q145 805 205 810M333 790L305 790Q290 810 295 825L335 826"/></svg>';
  btn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();api.toggle()});
  btn.addEventListener('contextmenu',e=>e.preventDefault());
  document.getElementById('inv').appendChild(btn);
  box.addEventListener('touchstart',e=>e.stopPropagation(),{passive:false});   // 装備欄に触れても視点・移動にしない
  box.addEventListener('pointerdown',e=>e.stopPropagation());
  function draw(){KEYS.forEach(k=>{
    const it=items[k],e=els[k],ic=e.querySelector('.ic'),has=!!(it&&it.icon);
    if(has&&ic.getAttribute('src')!==it.icon)ic.src=it.icon;
    ic.style.display=has?'block':'none';
    e.querySelector('.it').textContent=it&&!has?it.name:'';e.querySelector('.it').style.color=it&&it.color?it.color:'#fff';
    e.querySelector('.lb').style.display=it?'none':'block';e.title=it?(it.label||it.name):'';
  })}
  const api={items,get(k){return items[k]},set(k,it){if(KEYS.includes(k)){items[k]=it||null;draw()}},
    toggle(){const on=box.classList.toggle('open');btn.classList.toggle('sel',on);if(!on)MAGIC.closeList();if(on&&window.CRAFT_CLOSE)window.CRAFT_CLOSE()},   // 作成欄とは同時に開かない
    close(){box.classList.remove('open');btn.classList.remove('sel');MAGIC.closeList()}};
  addEventListener('keydown',e=>{if(e.code==='KeyE'&&!e.repeat)api.toggle()});
  draw();return api;
})();

// ---------- 斧（石斧）: 3Dモデル / インベントリ用の横向き画像 / 手に持った表示 ----------
const IRON_COLOR=0x9ea9b5;                                            // 鉄の色（やや青みのある鉄っぽい灰色。石より少し明るい）
function makeAxe(headColor){                                                   // シンプルな斧: 平たい木の柄＋頭（左に小さな出っ張り・右に大きな刃）。頭の色は石(既定)か鉄(IRON_COLOR)。柄はY軸方向（下端0、上端1）、厚みはZ方向

// ---------- 雷の魔法: 正面へ、角ばったギザギザの閃光がビームのように一瞬走る（当たった生き物にダメージ） ----------
const bolts=[],BOLT={LEN:22,SEG:16,JIT:.9,LIFE:.32,DMG:120,RADIUS:1.0};   // LEN=届く距離(m) / SEG=折れ曲がりの数 / JIT=ギザギザの大きさ(m) / LIFE=光っている秒数 / DMG=ダメージ / RADIUS=当たる幅(m)
const boltBox=new THREE.BoxGeometry(1,1,1);
function boltSegs(grp,pts,w,mat){for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],len=a.distanceTo(b);if(len<1e-4)continue;
  const m=new THREE.Mesh(boltBox,mat);m.position.copy(a).add(b).multiplyScalar(.5);m.lookAt(b);m.scale.set(w,w,len+w*.6);grp.add(m)}}
function castLightning(){
  const cp=Math.cos(player.pitch),A=new THREE.Vector3(-Math.sin(player.yaw)*cp,Math.sin(player.pitch),-Math.cos(player.yaw)*cp),yw=player.yaw;
  const O=new THREE.Vector3(camera.position.x+A.x*.9+Math.cos(yw)*.25,camera.position.y+A.y*.9-.2,camera.position.z+A.z*.9-Math.sin(yw)*.25);   // 杖の先あたり（画面の右下）から
  let L=BOLT.LEN;for(let d=1;d<=BOLT.LEN;d+=.5){const x=O.x+A.x*d,y=O.y+A.y*d,z=O.z+A.z*d;if(y<heightAt(x,z)){L=d;break}}   // 地面に当たったらそこまで
  const R=new THREE.Vector3().crossVectors(A,new THREE.Vector3(0,1,0));if(R.lengthSq()<1e-4)R.set(1,0,0);R.normalize();const U=new THREE.Vector3().crossVectors(R,A).normalize();
  const pts=[O.clone()];
  for(let i=1;i<=BOLT.SEG;i++){const t=i/BOLT.SEG,j=BOLT.JIT*(i===BOLT.SEG?.4:1)*(.4+Math.random()*.6);
    pts.push(O.clone().addScaledVector(A,L*t).addScaledVector(R,(Math.random()-.5)*2*j).addScaledVector(U,(Math.random()-.5)*2*j))}
  const mOut=new THREE.MeshBasicMaterial({color:0x7fa8ff,transparent:true,opacity:.75,blending:THREE.AdditiveBlending,depthWrite:false}),
        mCore=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false});
  const g=new THREE.Group();
  boltSegs(g,pts,.16,mOut);boltSegs(g,pts,.05,mCore);
  for(let b=0;b<3;b++){const k=2+Math.floor(Math.random()*(BOLT.SEG-5)),side=Math.random()<.5?1:-1,bp=[pts[k].clone()];   // 枝分かれ: 途中から横へ短く折れ曲がる
    for(let i=1;i<=4;i++)bp.push(bp[i-1].clone().addScaledVector(A,.9+Math.random()*.6).addScaledVector(R,side*(.5+Math.random()*1.1)).addScaledVector(U,(Math.random()-.5)*1.4));
    boltSegs(g,bp,.09,mOut);boltSegs(g,bp,.03,mCore)}
  scene.add(g);bolts.push({g,mOut,mCore,t:0});
  for(const c of creatures){if(c.hp<=0)continue;const sz=c.size||1,v=new THREE.Vector3(c.x-O.x,c.y+sz-O.y,c.z-O.z),d=v.dot(A);   // ビームの線に近い生き物にダメージ

function updateLightning(dt){

    const k=1-b.t/BOLT.LIFE;b.g.visible=Math.random()<.85;b.mOut.opacity=.75*k;b.mCore.opacity=k}   // ちかちか光って消える

// ---------- 氷の魔法: 目の前の生き物を青くして凍らせる。動けなくなり、しばらくすると解ける ----------
const ICE={RANGE:12,R:3,CRE_TIME:8,BLUE:.7,COL:new THREE.Color(0x8fd8ff)},iceMats=[0xe8f8ff,0x9fdcff,0xffffff].map(c=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.9,depthWrite:false}));   // RANGE=届く距離(m) / R=当たった場所から凍る範囲(m) / CRE_TIME=生き物が凍る秒数 / BLUE=青くする強さ
function castIce(){
  const cp=Math.cos(player.pitch),A=new THREE.Vector3(-Math.sin(player.yaw)*cp,Math.sin(player.pitch),-Math.cos(player.yaw)*cp),yw=player.yaw,cam=camera.position;
  const O=new THREE.Vector3(cam.x+A.x*.9+Math.cos(yw)*.25,cam.y+A.y*.9-.2,cam.z+A.z*.9-Math.sin(yw)*.25);
  let T=ICE.RANGE;                                                    // 当たる距離: 視線上で最初にぶつかる 生き物・木・岩・地面
  for(const c of creatures){if(c.hp<=0)continue;const sz=c.size||1,v=new THREE.Vector3(c.x-cam.x,c.y+sz*.95-cam.y,c.z-cam.z),d=v.dot(A);
    if(d>0&&d<T&&v.addScaledVector(A,-d).length()<HIT_R*sz+.3)T=d}
  const ccx=Math.floor(cam.x/CHUNK),ccz=Math.floor(cam.z/CHUNK),near=[];
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const c=chunks.get((ccx+i)+','+(ccz+j));if(c&&c.userData)near.push(c.userData)}
  for(const u of near){
    for(const tr of u.trees||[]){const rad=tr.r*tr.sx+.3,hh=Math.min(tr.th*tr.sy,4.5);
      for(let d=1;d<T;d+=.5){const x=cam.x+A.x*d,z=cam.z+A.z*d,y=cam.y+A.y*d;if(Math.hypot(x-tr.x,z-tr.z)<rad&&y>tr.y-.2&&y<tr.y+hh){T=d;break}}}
    for(const rk of u.rocks||[]){const rx=rk.s*.9+.35,ry=rk.sy*.9+.35;
      for(let d=1;d<T;d+=.5){const x=cam.x+A.x*d,z=cam.z+A.z*d,y=cam.y+A.y*d;if(((x-rk.x)/rx)**2+((y-rk.y)/ry)**2+((z-rk.z)/rx)**2<1){T=d;break}}}
  }
  for(let d=1;d<T;d+=.5){if(cam.y+A.y*d<heightAt(cam.x+A.x*d,cam.z+A.z*d)){T=d;break}}
  const hx=cam.x+A.x*T,hy=cam.y+A.y*T,hz=cam.z+A.z*T;               // 当たった場所
  const hr=ICE.R;
  for(const c of creatures){if(c.hp<=0||!magicHits(c))continue;if(Math.hypot(c.x-hx,c.z-hz)<hr+.5*(c.size||1)&&Math.abs((c.y+(c.size||1))-hy)<3){   // 当たった場所の近くの生き物を凍らせる
    if(!(c.frozen>0)){c.iceOld=c.mat.color.clone();c.mat.color.lerp(ICE.COL,ICE.BLUE)}c.frozen=Math.max(c.frozen||0,ICE.CRE_TIME*magicRate(c))}}
  for(let i=0;i<40;i++){const a=Math.random()*6.283,sp=1+Math.random()*3.5;                  // 当たった場所に氷のかけらが散る
    addWaterPart(hx+Math.cos(a)*.3,hy,hz+Math.sin(a)*.3,Math.cos(a)*sp,1.5+Math.random()*3.5,Math.sin(a)*sp,.5+Math.random()*.5,.05+Math.random()*.08,9,iceMats)}
}

// ---------- 高エネルギー魔法（火と雷の次）: 一瞬だけ走る、真っ白な芯のレーザーのようなビーム。当たった所で閃光・衝撃波・火花が出て、地面なら焼け跡が残る。魔力が低い生き物には、他の魔法と同じく効かない ----------
const BLAST={CHARGE:0,TIME:.22,TICK:9,DMG:600,LEN:38,RADIUS:1.2};   // TIME=光っている秒数(一瞬) / DMG=当たった時の1回のダメージ(魔力に応じて通る割合は他の魔法と同じ) / LEN=届く距離(m) / RADIUS=太さ(m) / CHARGE=ため時間(0=ためずに即発射)
const blastMats=[0xffffff,0xcfe4ff,0x8fb8ff].map(c=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));
const blastFlash=document.createElement('div');blastFlash.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:49;opacity:0;background:radial-gradient(circle at 60% 70%,rgba(255,255,255,.9),rgba(190,215,255,.4) 50%,rgba(0,0,0,0) 80%)';document.body.appendChild(blastFlash);
let blast=null,scorch=null;
const glowMat=(c,o)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
function castBlast(){
  if(!blast){
    const geo=new THREE.CylinderGeometry(1,1,1,24,1,true);geo.rotateX(Math.PI/2);   // 細い円柱を何枚も重ねて、芯が真っ白で外へ向かって青白くにじむ光にする（+Z方向へのびる）
    const g=new THREE.Group(),layers=[[.07,1,0xffffff],[.16,.7,0xeaf4ff],[.34,.3,0xa9cfff],[.7,.13,0x6a9cff]].map(([r,o,c])=>{const m=new THREE.Mesh(geo,glowMat(c,o));g.add(m);return{m,r,o}});
    g.visible=false;scene.add(g);
    const flare=new THREE.Mesh(fireGeo,glowMat(0xffffff,1)),hit=new THREE.Mesh(fireGeo,glowMat(0xcfe4ff,1)),ring=new THREE.Mesh(new THREE.RingGeometry(.92,1,48),glowMat(0xcfe4ff,1));
    flare.visible=hit.visible=ring.visible=false;scene.add(flare);scene.add(hit);scene.add(ring);
    const sc=new THREE.Mesh(new THREE.CircleGeometry(1,24),glowMat(0xff7a20,.8));sc.rotation.x=-Math.PI/2;sc.visible=false;scene.add(sc);scorch={m:sc,t:9};   // 地面に当たった所の焼け跡(赤く光って冷める)
    blast={g,layers,flare,hit,ring,t:0,tick:0,on:false,fired:false};
  }
  blast.t=0;blast.tick=0;blast.on=true;blast.fired=false;
}
function updateBlast(dt){
  if(scorch&&scorch.t<1.6){scorch.t+=dt;const k=Math.max(0,1-scorch.t/1.6);scorch.m.material.opacity=.8*k*k;scorch.m.visible=k>0}
  if(!blast||!blast.on)return;
  blast.t+=dt;const bt=blast.t,{A,O}=beamFrame();
  if(bt>BLAST.TIME){blast.on=false;blast.g.visible=false;blast.flare.visible=blast.hit.visible=blast.ring.visible=false;return}
  let L=BLAST.LEN,ground=false;for(let d=1;d<=BLAST.LEN;d+=.5){if(O.y+A.y*d<heightAt(O.x+A.x*d,O.z+A.z*d)){L=d;ground=true;break}}   // 地面に当たったらそこまで
  const E=O.clone().addScaledVector(A,L),M=O.clone().addScaledVector(A,L/2);
  if(!blast.fired){blast.fired=true;blastFlash.style.transition='none';blastFlash.style.opacity=.55;void blastFlash.offsetWidth;blastFlash.style.transition='opacity .3s';blastFlash.style.opacity=0;   // 放った瞬間に画面が白く光る
    for(let k=0;k<22;k++)addFirePart(E.x,E.y,E.z,(Math.random()-.5)*11,Math.random()*8,(Math.random()-.5)*11,.35+Math.random()*.4,.05+.07*Math.random());   // 当たった所から赤熱した火花が飛び散る
    if(ground){scorch.t=0;scorch.m.position.set(E.x,heightAt(E.x,E.z)+.05,E.z);scorch.m.scale.setScalar(1.3);scorch.m.material.opacity=.8;scorch.m.visible=true}}
  const f=bt<BLAST.TIME*.35?1:Math.max(0,1-(bt-BLAST.TIME*.35)/(BLAST.TIME*.65)),fl=.88+Math.random()*.12,ramp=Math.min(1,bt/.015);   // 光は一瞬でフル出力になり、すぐ細って消える
  blast.g.visible=true;
  for(const l of blast.layers){l.m.position.copy(M);l.m.lookAt(E);const r=l.r*ramp*(l.r<.2?fl:1);l.m.scale.set(r,r,L);l.m.material.opacity=l.o*f}

    if(navigator.vibrate)navigator.vibrate(30);
    sig='';render();
  }
  const api={
    toggle(){const on=box.classList.toggle('open');btn.classList.toggle('sel',on);if(on){EQUIP.close();sig='';render()}},
    close(){box.classList.remove('open');btn.classList.remove('sel')}
  };
  window.CRAFT_CLOSE=api.close;
  setInterval(()=>{if(box.classList.contains('open'))render()},400);   // 開いている間は、拾った物で材料が変わるのを反映する
  return api;
})();

let last=performance.now(),frame=0;
function safeRender(){
  try{renderer.clear();renderer.render(scene,camera);if(heldOn){renderer.clearDepth();renderer.render(heldScene,heldCam)}}catch(err){EU_ERR='描画エラー: '+(err&&err.message);info.textContent=EU_ERR}
}
// ---------- 体力バー・空腹バー ----------
// 体力: ダッシュ（走る）と物を振る時に減る。走り続けるほど減りが速くなる。使っていない間は少し待ってから回復（空腹が減っているほど回復が遅い）。0になると回復するまで走れず振れない。
// 空腹: 時間とともに減る。走り続けるほど減りが速くなる。自然には回復しない。
const STAT={sta:100,hun:100,runT:0,idle:0,exh:false,swingCost:2},staBar=document.getElementById('staBar'),hunBar=document.getElementById('hunBar');
function statsUpdate(dt,running){
  if(running){
    STAT.runT=Math.min(10,STAT.runT+dt);STAT.idle=0;
    STAT.sta-=(2+STAT.runT*.6)*dt;                             // 走り始め2/秒 → 10秒走り続けると8/秒
    STAT.hun-=(.3+STAT.runT*.06)*dt;
  }else{
    STAT.runT=Math.max(0,STAT.runT-dt*2);STAT.idle+=dt;
    if(STAT.idle>.8)STAT.sta+=12*(.25+.75*STAT.hun/100)*dt;   // .8秒休むと回復開始
  }
  STAT.hun-=.1*dt;                                              // 常にゆっくり減る
  STAT.sta=Math.max(0,Math.min(100,STAT.sta));STAT.hun=Math.max(0,Math.min(100,STAT.hun));
  if(STAT.sta<=0)STAT.exh=true;else if(STAT.sta>=15)STAT.exh=false;   // 0で息切れ→15まで回復するまで走れない
  staBar.style.setProperty('--p',STAT.sta/100);hunBar.firstChild.style.width=STAT.hun+'%';
  staBar.classList.toggle('low',STAT.sta<25);staBar.classList.toggle('exh',STAT.exh);hunBar.classList.toggle('low',STAT.hun<25);
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  let fx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x,fz=(keys.KeyS?1:0)-(keys.KeyW?1:0)+joy.y;
  if(MINI.big){fx=0;fz=0}
  const l=Math.hypot(fx,fz);if(l>1){fx/=l;fz/=l}
  const wdT=waterDepthAt(player.x,player.z,player.gy);player.wdep=(player.wdep||0)+(wdT-(player.wdep||0))*Math.min(1,dt*6);   // 水の深さ（なめらかに変える）
  const inWater=player.wdep>=.25;                                  // 水中（深さ25cm以上）: ダッシュもジャンプもできない
  const running=(keys.ShiftLeft||dashHeld||dashLock)&&l>.1&&!STAT.exh&&!MINI.big&&!inWater;statsUpdate(dt,running);
  const wm=1-.45*Math.min(1,player.wdep/.4);                       // 水に入ると動きが遅くなる（深さ0.4m以上で55%の速さ）
  const speed=(running?14:7)*dt*wm,s=Math.sin(player.yaw),c=Math.cos(player.yaw);
  const mx=(fx*c+fz*s)*speed,mz=(-fx*s+fz*c)*speed,ns=Math.max(1,Math.ceil(Math.hypot(mx,mz)/.1));   // 1回に0.1mより大きく動かさない（階段・壁のすり抜け防止）
  {const sx=mx/ns,sz=mz/ns;for(let i=0;i<ns;i++){if(!tryMove(sx,sz)&&!tryMove(sx,0))tryMove(0,sz)}}   // 壁に当たったら、X方向だけ・Z方向だけに分けて滑る
  if(MINI.big)jumpHeld=false;
  if(!player.air&&player.y-(player.gy+1.7)>FALL_GAP){player.air=true;player.vy=0}   // 足もとの地面が遠ざかった（崖から出た）→ 落下
  if((jumpHeld||keys.Space)&&!inWater&&!player.air&&player.y<=player.gy+1.7+.25){player.air=true;player.vy=JUMPV}   // 地面にいるときだけ跳べる
  if(player.air){                                                  // 空中: 重力で上がって落ちる。足元の地面に届いたら着地
    player.vy=Math.max(VMIN,player.vy-GRAV*dt);player.y+=player.vy*dt;
    const eye=player.gy+1.7;
    if(player.y<=eye&&player.vy<=0){
      const hit=-player.vy;player.y=eye-(hit>6?Math.min(.55,(hit-6)*.035):0);   // 強く着地すると視点がぐっと沈んで戻る
      player.air=false;player.vy=0;
    }
  }else player.y+=(player.gy+1.7-player.y)*Math.min(1,dt*12);
  camera.position.set(player.x,player.y-Math.min(.45,(player.wdep||0)*.9),player.z);   // 水に入ると目の高さが少し沈む（最大45cm）
  camera.rotation.set(player.pitch,player.yaw,0);
  water.position.x=player.x;water.position.z=player.z;
  updateEnv(dt);
  waterUpdate(dt);
  if(frame++%10===0){updateChunks();info.textContent=`seed:${SEED}  chunks:${chunks.size}  ${biomeName()}${EU_ERR?'  '+EU_ERR:''}`;updateNav()}
  const tx=Math.round(player.x/.0586)*.0586,tz=Math.round(player.z/.0586)*.0586;   // 影のちらつき防止（テクセルにスナップ）
  sun.target.position.set(tx,0,tz);sun.position.set(tx+SUN_OFF.x,SUN_OFF.y,tz+SUN_OFF.z);
  miniUpdate();
  updateShakes(dt);
  updateDrops(dt);
  updateCreatures(dt);
  updateBloodParticles(dt);
  updateFire(dt);
  updateHeld(dt);
  if(!MINI.big)safeRender();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
